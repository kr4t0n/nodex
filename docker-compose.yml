# Postgres for local development.
#
# The registry itself needs no database and never will: it is static files on a
# CDN. This exists only for accounts, which is the one thing that cannot be
# static. Nothing in `registry/`, `packages/core`, or `packages/cli` talks to it.
#
# Production is expected to be a managed Postgres, so nothing here is tuned for
# durability. It is a throwaway you can delete and re-migrate.

services:
  postgres:
    image: postgres:18.6-alpine
    container_name: nodex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nodex
      POSTGRES_PASSWORD: nodex
      POSTGRES_DB: nodex
    ports:
      - '5433:5432'
    volumes:
      - nodex-pgdata:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` alone reports true while the container is still running its
      # first-boot init, so the port is open before the database will accept a
      # real query. Running an actual query is the honest check.
      test: ['CMD-SHELL', 'psql -U nodex -d nodex -c "select 1" || exit 1']
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  nodex-pgdata:
