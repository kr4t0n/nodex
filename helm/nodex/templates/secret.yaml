{{- /*
  Rendered only when the user supplied values inline. Pointing at an
  existingSecret means they manage it elsewhere, and generating a second one
  would leave two sources of truth for the same credential.
*/ -}}
{{- $needsDatabase := and .Values.database.url (not .Values.database.existingSecret) -}}
{{- $needsGithub := and .Values.github.clientId (not .Values.github.existingSecret) -}}
{{- if or $needsDatabase $needsGithub }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nodex.fullname" . }}
  labels:
    {{- include "nodex.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{- if $needsDatabase }}
  DATABASE_URL: {{ .Values.database.url | quote }}
  {{- end }}
  {{- if $needsGithub }}
  GITHUB_CLIENT_ID: {{ .Values.github.clientId | quote }}
  GITHUB_CLIENT_SECRET: {{ .Values.github.clientSecret | quote }}
  {{- end }}
{{- end }}
