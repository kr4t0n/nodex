{{- include "nodex.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nodex.fullname" . }}
  labels:
    {{- include "nodex.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "nodex.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nodex.labels" . | nindent 8 }}
      annotations:
        {{- /*
          Rolls the pods when the Secret's contents change. Without this a
          `helm upgrade` that only rotates a credential updates the Secret and
          leaves the running pods holding the old value, which looks like the
          upgrade silently did nothing.
        */}}
        {{- if not .Values.database.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "nodex.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 4180
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            {{- with .Values.siteUrl }}
            - name: NEXT_PUBLIC_SITE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- include "nodex.databaseEnv" . | nindent 12 }}
            {{- if or .Values.github.clientId .Values.github.existingSecret }}
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.github.existingSecret | default (include "nodex.fullname" .) }}
                  key: GITHUB_CLIENT_ID
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.github.existingSecret | default (include "nodex.fullname" .) }}
                  key: GITHUB_CLIENT_SECRET
            {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              {{- /*
                The landing page, which is static and touches nothing external.
                Probing a route that reads the database would restart healthy
                pods whenever the database blinked, which is the opposite of
                what a liveness probe is for.
              */}}
              path: /
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
