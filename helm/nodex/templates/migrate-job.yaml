{{- /*
  Applies the schema before any new pod serves traffic.

  A hook rather than an init container: an init container would run once per
  pod and per restart, so three replicas would race three migrators against one
  database. A hook runs once per release.

  Migrations ship inside the image, so this needs no extra artifact and can
  never drift from the app it is migrating. `migrate.mjs` records what it has
  applied and skips those, so re-running is a no-op.
*/ -}}
{{- if and .Values.migrations.enabled (include "nodex.databaseConfigured" .) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "nodex.fullname" . }}-migrate
  labels:
    {{- include "nodex.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": {{ .Values.migrations.hookDeletePolicy }}
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "nodex.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "nodex.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ['node', 'scripts/migrate.mjs']
          env:
            {{- include "nodex.databaseEnv" . | nindent 12 }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
