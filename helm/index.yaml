    description: 'nodex — a component registry organised by design language. This
      chart deploys the web app, which serves the browsable registry and the accounts
      layer.  PostgreSQL is NOT bundled and is NOT required. Without a database the
      site serves every public page and the sign-in page reports itself unconfigured;
      point `database.url` at a managed instance when you want accounts. '
