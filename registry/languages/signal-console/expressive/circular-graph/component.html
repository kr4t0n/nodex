<div class="nx-circular-graph">
  <div class="card">
    <!--
      The head carries the current value, because the first question asked of a
      live chart is "what is it now". This is the language's anatomy, not
      mono-editorial's sentence-and-instructions — the same chart type in the
      other language opens with a title and a reading key instead.
    -->
    <div class="head">
      <span class="label">SERVICE MESH</span>
      <span class="value" data-nx-mount="total">—</span>
    </div>

    <svg
      data-nx-mount="circular-graph"
      viewBox="0 0 420 268"
      preserveAspectRatio="xMinYMid meet"
    ></svg>

    <div class="foot">
      <span>MESH TELEMETRY</span>
      <span>60S WINDOW</span>
      <span data-nx-mount="age">UPDATED 0S AGO</span>
    </div>
  </div>
</div>
