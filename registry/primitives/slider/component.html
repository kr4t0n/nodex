<div style="display: flex; flex-direction: column; gap: 22px; width: 100%; max-width: 320px">
  <div class="nx-slider-field">
    <div class="nx-slider-value">
      <span>Stroke width</span>
      <span>0.8px</span>
    </div>
    <input class="nx-slider" type="range" min="0" max="100" value="42" aria-label="Stroke width" />
  </div>

  <div class="nx-slider-field">
    <div class="nx-slider-value">
      <span>Sample size</span>
      <span>90 days</span>
    </div>
    <input class="nx-slider nx-slider--hollow" type="range" min="0" max="100" value="72" aria-label="Sample size" />
    <div class="nx-slider-ticks" style="--nx-slider-steps: 12"></div>
  </div>

  <div class="nx-slider-field">
    <div class="nx-slider-value">
      <span>Unavailable</span>
      <span>--</span>
    </div>
    <input class="nx-slider" type="range" min="0" max="100" value="25" disabled aria-label="Unavailable" />
  </div>
</div>
