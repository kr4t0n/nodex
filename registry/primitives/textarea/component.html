<div style="display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 380px">
  <div class="nx-field">
    <label class="nx-field__label" for="nx-sub">Subtitle</label>
    <textarea class="nx-textarea" id="nx-sub" rows="3">
one tick = one respondent in a hundred · inked = picked it</textarea
    >
    <div class="nx-field__foot">
      <span>Say what one mark represents.</span>
      <span class="nx-field__count">58 / 120</span>
    </div>
  </div>

  <div class="nx-field">
    <label class="nx-field__label" for="nx-opt">Chart options</label>
    <textarea class="nx-textarea nx-textarea--mono nx-textarea--auto" id="nx-opt" rows="3">
{ lineStyle: { width: 0.8 } }</textarea
    >
    <p class="nx-field__help">Grows with its content where supported.</p>
  </div>
</div>
