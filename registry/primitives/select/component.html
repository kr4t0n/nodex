<!-- Two rows rather than one: a labelled field is taller than a bare control,
     so side by side they sit at different heights. Layout here is inline
     because it belongs to the demo, not to the primitive. -->
<div style="display: flex; flex-direction: column; gap: 20px; align-items: flex-start">
  <div class="nx-field">
    <label class="nx-field__label" for="nx-type">Component type</label>
    <select class="nx-select" id="nx-type">
      <option>All types</option>
      <option>bar</option>
      <option>heatmap</option>
      <option>lollipop</option>
      <option>sankey</option>
    </select>
  </div>

  <select class="nx-select nx-select--auto" aria-label="Reading speed">
    <option>Close read</option>
    <option>Glance</option>
  </select>
</div>
