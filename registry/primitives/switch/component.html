<div class="nx-choice-group" style="max-width: 280px">
  <label class="nx-choice nx-choice--spread">
    Draw on scroll
    <input class="nx-switch" type="checkbox" role="switch" checked />
  </label>

  <label class="nx-choice nx-choice--spread">
    Replay on click
    <input class="nx-switch" type="checkbox" role="switch" checked />
  </label>

  <label class="nx-choice nx-choice--spread">
    Show gridlines
    <input class="nx-switch" type="checkbox" role="switch" />
  </label>

  <label class="nx-choice nx-choice--spread nx-choice--disabled">
    Loop animation
    <input class="nx-switch" type="checkbox" role="switch" disabled />
  </label>
</div>
