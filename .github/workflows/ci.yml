name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Install preview browser
        run: npx playwright install --with-deps chromium

      # Build before consumers run: check:registry intentionally emits nothing.
      - name: Build registry
        run: npm run build:registry

      # Exercise built previews and a fresh React app with real CLI installation.
      - name: Smoke-test components
        run: npm run smoke

      - name: Test registry contracts and read-only validation
        run: npm test

      # Check conflicts, dependency managers, addresses and authenticated paths.
      - name: Smoke-test the CLI
        run: npm run smoke:cli

      # Keep the shell's curated primitive stylesheet list synchronized.
      - name: Check the shell loads what it uses
        run: npm run check:shell

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Prerendering every route reads the manifest, so a build failure here
      # also catches a manifest the app can no longer make sense of.
      - name: Build the site
        run: npm run build --workspace @nodex/web
