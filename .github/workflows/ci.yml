name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  auth-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nodex_auth_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nodex_auth_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HUSKY: '0'
      DATABASE_URL: postgresql://postgres@localhost:5432/nodex_auth_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run db:migrate
      - run: pnpm run test:auth:postgres

  verify:
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan git history for secrets
        run: |
          scanner_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$scanner_dir"
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$scanner_dir/gitleaks.tar.gz"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$scanner_dir/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
          "$scanner_dir/gitleaks" git --redact --no-banner

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install preview browser
        run: pnpm exec playwright install --with-deps chromium

      # Build before consumers run: check:registry intentionally emits nothing.
      - name: Build registry
        run: pnpm run build:registry

      - name: Smoke-test the packed CLI in a fresh npm consumer
        run: pnpm run smoke:pack

      # Exercise built previews and a fresh React app with real CLI installation.
      - name: Smoke-test components
        run: pnpm run smoke

      - name: Test registry contracts and read-only validation
        run: pnpm test

      # Check conflicts, dependency managers, addresses and authenticated paths.
      - name: Smoke-test the CLI
        run: pnpm run smoke:cli

      # Keep the shell's curated primitive stylesheet list synchronized.
      - name: Check the shell loads what it uses
        run: pnpm run check:shell

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      # Prerendering every route reads the manifest, so a build failure here
      # also catches a manifest the app can no longer make sense of.
      - name: Build the site
        run: pnpm --filter @nodex/web run build

      - name: Smoke-test landing animation and language switching
        run: pnpm run smoke:landing

      - name: Smoke-test gallery loading and preview interaction
        run: pnpm run smoke:gallery

  docker-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build the production image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: nodex:ci

      - name: Check migration files and native dependencies in the final image
        run: |
          docker run --rm nodex:ci node --input-type=module -e '
            import assert from "node:assert/strict";
            import { createRequire } from "node:module";
            import { readdirSync } from "node:fs";
            const require = createRequire("/app/scripts/migrate.mjs");
            assert.equal(typeof require("pg").Client, "function");
            const webRequire = createRequire("/app/apps/web/package.json");
            const nextRequire = createRequire(webRequire.resolve("next"));
            assert(nextRequire("sharp").versions.vips);
            assert(readdirSync("/app/apps/web/migrations").some(file => file.endsWith(".sql")));
          '

      - name: Check the final image serves the site and registry
        run: |
          docker run --detach --name nodex-ci --publish 4180:4180 nodex:ci
          trap 'docker logs nodex-ci; docker rm --force nodex-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:4180/r/languages.json >/dev/null; then
              curl --fail --silent http://localhost:4180/ >/dev/null
              exit 0
            fi
            sleep 2
          done
          exit 1
