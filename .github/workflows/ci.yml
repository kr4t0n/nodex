name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Schema validation, slug uniqueness, taxonomy enum membership, density
      # values against each language's declaration, and the design-language
      # conformance lints. The slug and enum checks are what stop a future
      # import from silently corrupting search.
      #
      # `build:registry` rather than `check:registry`, and the difference
      # matters: `--check` validates without writing, so a fresh checkout is
      # left with no `public/r/`. That directory is a build artifact and is
      # gitignored, and both the CLI smoke test and the site build need it.
      # Building runs every check that `--check` runs, and then emits what the
      # later steps read.
      - name: Build registry
        run: npm run build:registry

      # Proves components still mount and draw. Parsing is not enough: a chart
      # with an over-shaken helper set parses fine and renders nothing.
      - name: Smoke-test components
        run: npm run smoke

      # Exercises the surface a coding agent actually touches: init and add
      # against a temporary project, across all three component shapes.
      - name: Smoke-test the CLI
        run: npm run smoke:cli

      # The app links a curated set of primitive stylesheets. Using a primitive
      # it does not load renders unstyled with nothing in the console to say so,
      # which is exactly the kind of failure nobody notices in review.
      - name: Check the shell loads what it uses
        run: npm run check:shell

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Prerendering every route reads the manifest, so a build failure here
      # also catches a manifest the app can no longer make sense of.
      - name: Build the site
        run: npm run build --workspace @nodex/web
