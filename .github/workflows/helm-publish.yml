name: helm-publish

# Publishing configuration and release steps: README.md, "Deploy and publish".

on:
  push:
    branches: [main]
    paths:
      - 'helm/**'
      - '.github/workflows/helm-publish.yml'
  workflow_dispatch:

permissions:
  contents: write # required to push commits to gh-pages

concurrency:
  # Serialize all gh-pages writers without interrupting a versioned publication.
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Lint the chart
        # Published chart versions are immutable; validate before packaging.
        run: |
          set -euo pipefail
          helm lint helm/nodex
          helm template ci helm/nodex >/dev/null
          helm template ci helm/nodex \
            --set siteUrl=https://example.com \
            --set database.url=postgres://u:p@h:5432/d \
            --set github.clientId=id --set github.clientSecret=secret \
            --set ingress.enabled=true \
            --set 'ingress.hosts[0].host=example.com' \
            --set 'ingress.hosts[0].paths[0].path=/' >/dev/null

      - name: Check out gh-pages, creating it if this is the first publish
        run: |
          set -euo pipefail
          git config --global user.name  'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth 1
            # The later push needs a local branch, not a detached worktree.
            git worktree add -B gh-pages pages origin/gh-pages
          else
            # An orphan branch, so the chart repo carries no source history.
            echo "gh-pages does not exist yet, creating it"
            git worktree add --detach pages
            cd pages
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
          fi

      - name: Package and index the chart under /helm
        env:
          # Index download URLs are absolute and must match the served Pages path.
          REPO_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/helm
        run: |
          set -euo pipefail
          mkdir -p pages/helm

          # Jekyll can drop underscore-prefixed paths from static assets.
          touch pages/.nojekyll

          # helm package overwrites files; skip published versions to keep them immutable.
          CHART_VERSION="$(helm show chart helm/nodex | awk '/^version:/ { print $2 }')"
          if [ -f "pages/helm/nodex-${CHART_VERSION}.tgz" ]; then
            echo "::notice title=Chart version already published::nodex-${CHART_VERSION}.tgz exists and was left untouched. Bump version in helm/nodex/Chart.yaml to release changes."
          else
            helm package helm/nodex --destination pages/helm
          fi

          # --merge carries forward entries for versions already published, so
          # a user can still pin an older release after a new one ships.
          if [ -f pages/helm/index.yaml ]; then
            helm repo index pages/helm --url "$REPO_URL" --merge pages/helm/index.yaml
          else
            helm repo index pages/helm --url "$REPO_URL"
          fi

          echo "Repo URL : $REPO_URL"
          echo "Tarballs :"
          ls -1 pages/helm/*.tgz || true

      - name: Commit and push to gh-pages
        working-directory: pages
        run: |
          set -euo pipefail
          # `.nojekyll` sits at the branch root, so staging only `helm` would
          # silently leave it out of every commit.
          git add helm .nojekyll
          if git diff --staged --quiet; then
            echo "no chart changes, nothing to publish"
            exit 0
          fi
          git commit -m "chore(helm): publish chart from ${GITHUB_SHA::7}"
          git push origin gh-pages
