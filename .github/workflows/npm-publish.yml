name: npm

# Trusted publishing setup and release steps: CONTRIBUTING.md, "Deploy and publish".

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm exchanges this workflow's OIDC identity for publish authorization
      # and generates provenance automatically.
      id-token: write
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      # Keep registry selection above separate from setup-node's token-based
      # npmrc generation. The bundled npm must support OIDC authentication.
      - name: Verify npm supports trusted publishing
        run: |
          node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number); if (!(major > 11 || major === 11 && (minor > 5 || minor === 5 && patch >= 1))) throw new Error("Trusted publishing requires npm >=11.5.1");' "$(npm --version)"

      - run: pnpm install --frozen-lockfile

      # Published versions are immutable; let a repeated release skip publication.
      - id: version
        run: |
          VERSION="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$GITHUB_REF_TYPE" = 'tag' ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match CLI version $VERSION."
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "@kubitnodes/nodex@$VERSION" version >/dev/null 2>&1; then
            echo 'published=true' >> "$GITHUB_OUTPUT"
            echo "::notice title=Version already published::@kubitnodes/nodex@$VERSION exists on npm and was left untouched. Bump the version in packages/cli/package.json to release changes."
          else
            echo 'published=false' >> "$GITHUB_OUTPUT"
          fi

      # Typecheck follows the registry build because web pretypecheck reads its manifest.
      - if: steps.version.outputs.published == 'false'
        run: |
          pnpm run lint
          pnpm exec playwright install --with-deps chromium
          pnpm run build:registry
          pnpm run typecheck
          pnpm run smoke:cli

      # Exercise the packed files in isolation before publishing that exact tarball.
      - name: Smoke-test the packed CLI in a fresh npm consumer
        if: steps.version.outputs.published == 'false'
        run: pnpm run smoke:pack "$RUNNER_TEMP/nodex-pack"

      - if: steps.version.outputs.published == 'false'
        run: npm publish "$RUNNER_TEMP/nodex-pack"/*.tgz
