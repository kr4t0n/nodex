name: npm

# Publishes packages/cli to npm as @kubitnodes/nodex.
#
# Uses npm trusted publishing (OIDC), with no npm token secret. The package's
# trusted publisher must authorize kr4t0n/nodex and npm-publish.yml on GitHub.
#
# Triggered by a v* tag, and manually. Not by pushes to main: the version lives
# in package.json, so publishing on every push would either republish the same
# version and fail, or quietly ship whatever happened to be committed.
#
# The repo runs TypeScript directly — tsconfig.base.json is emitDeclarationOnly
# and every specifier ends in `.ts`, because Node strips types natively. That is
# wrong for a package a stranger installs, who may be on a Node without type
# stripping, so publishing compiles real JavaScript through
# tsconfig.publish.json. The single @nodex/core import is `import type` and
# erases completely, which is why the published package has no dependencies and
# @nodex/core does not need publishing alongside it.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm exchanges this workflow's OIDC identity for publish authorization
      # and generates provenance automatically.
      id-token: write
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      # Keep registry selection above separate from setup-node's token-based
      # npmrc generation. The bundled npm must support OIDC authentication.
      - name: Verify npm supports trusted publishing
        run: |
          node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number); if (!(major > 11 || major === 11 && (minor > 5 || minor === 5 && patch >= 1))) throw new Error("Trusted publishing requires npm >=11.5.1");' "$(npm --version)"

      - run: npm ci

      # A published version is immutable, and npm rejects a republish with an
      # error that reads like a credentials problem. Check first so a re-run of
      # an already-published tag reports the real reason and passes.
      - id: version
        run: |
          VERSION="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$GITHUB_REF_TYPE" = 'tag' ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match CLI version $VERSION."
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "@kubitnodes/nodex@$VERSION" version >/dev/null 2>&1; then
            echo 'published=true' >> "$GITHUB_OUTPUT"
            echo "::notice title=Version already published::@kubitnodes/nodex@$VERSION exists on npm and was left untouched. Bump the version in packages/cli/package.json to release changes."
          else
            echo 'published=false' >> "$GITHUB_OUTPUT"
          fi

      # The CLI is the one artifact a stranger runs unsupervised, so it is worth
      # proving it works before shipping rather than after. smoke:cli drives a
      # real init and add against a built registry. Typecheck follows the build
      # because the web app's pretypecheck syncs from the built manifest.
      - if: steps.version.outputs.published == 'false'
        run: |
          npm run lint
          npx playwright install --with-deps chromium
          npm run build:registry
          npm run typecheck
          npm run smoke:cli

      - if: steps.version.outputs.published == 'false'
        run: npm run build:cli

      # Prove the tarball is what a consumer actually gets: install it into a
      # scratch project and run the binary. Compiling successfully is not the
      # same as being runnable, and `files` narrows what ships.
      - if: steps.version.outputs.published == 'false'
        run: |
          npm pack --workspace @kubitnodes/nodex --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/verify" && cd "$RUNNER_TEMP/verify"
          npm init -y >/dev/null
          # Whatever npm named it. A scoped package packs to
          # <scope>-<name>-<version>.tgz, so hardcoding that spelling breaks
          # silently the next time the package is renamed.
          npm install "$RUNNER_TEMP"/*.tgz
          ./node_modules/.bin/nodex list --registry "$GITHUB_WORKSPACE/public"

      - if: steps.version.outputs.published == 'false'
        run: npm publish --workspace @kubitnodes/nodex
