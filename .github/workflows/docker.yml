name: docker

# Publishing configuration and release steps: CONTRIBUTING.md, "Deploy and publish".

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Unconfigured forks skip publication. Keep secrets out of script interpolation.
      - id: guard
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$USERNAME" ] && [ -n "$TOKEN" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::notice title=Docker Hub not configured::Set the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets to publish images.'
          fi

      - if: steps.guard.outputs.configured == 'true'
        uses: actions/checkout@v5

      - if: steps.guard.outputs.configured == 'true'
        uses: docker/setup-buildx-action@v3

      - if: steps.guard.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - if: steps.guard.outputs.configured == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: >-
            ${{ vars.DOCKERHUB_REPOSITORY || format('{0}/nodex', secrets.DOCKERHUB_USERNAME) }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - if: steps.guard.outputs.configured == 'true'
        uses: docker/build-push-action@v6
        with:
          # The repository root, not apps/web: the image builds the registry
          # before the app, and that lives outside the app directory.
          context: .
          # Only amd64 is exercised by the build-only pull-request check.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_REGISTRY_URL=${{ vars.NEXT_PUBLIC_REGISTRY_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
