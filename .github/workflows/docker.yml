name: Docker

# Publishes the web app to Docker Hub.
#
# Needs two repository secrets:
#   DOCKERHUB_USERNAME  your Docker Hub account
#   DOCKERHUB_TOKEN     an access token from Docker Hub, not your password
#
# And optionally two repository variables:
#   DOCKERHUB_REPOSITORY       image name, defaults to <username>/nodex
#   NEXT_PUBLIC_REGISTRY_URL   bake a CDN origin into the client bundle
#
# The registry URL is a build argument rather than runtime configuration
# because Next inlines NEXT_PUBLIC_* into the browser bundle at build time, and
# the code that reads it runs in the browser. NEXT_PUBLIC_SITE_URL is different:
# only server code reads it, so it stays runtime configuration and one image can
# serve any hostname.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: >-
            ${{ vars.DOCKERHUB_REPOSITORY || format('{0}/nodex', secrets.DOCKERHUB_USERNAME) }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          # The repository root, not apps/web: the image builds the registry
          # before the app, and that lives outside the app directory.
          context: .
          # amd64 only. An arm64 image would need the linux-arm64 variants of
          # lightningcss, oxide, swc, and sharp added to optionalDependencies
          # in the root package.json, for the same reason the x64 ones are
          # there, and emulated arm64 builds are slow enough to want a good
          # reason first.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_REGISTRY_URL=${{ vars.NEXT_PUBLIC_REGISTRY_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
