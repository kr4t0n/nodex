    iframe { display: block; width: 100%; height: calc(100% - 64px); border: 0; background: #f0efeb; }
    @media (max-width: 600px) { .bar { padding: 0 12px; } .brand { font-size: 11px; } select { max-width: 190px; } }

<body>
  <div class="bar">
    <div class="brand">Lieflat Charts · 64 charts</div>

  <script>
    const pages = {"lupi":{"label":"Lupi Editorial · 20 张","html":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\" />\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\" />\n\u003ctitle>Lieflat Charts — Lupi Gallery · 20 张参考实现\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n  :root{--bg:#F0EFEB;--dark:#1C1C1A;--ink:#1C1C1A;--muted:#8F8E88;--faint:#C6C5BF;--grid:#DEDDD6}\n  *{margin:0;padding:0;box-sizing:border-box}\n  body{background:var(--bg);font-family:'Inter',sans-serif;color:var(--ink);padding:40px;-webkit-font-smoothing:antialiased}\n  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px;max-width:1400px;margin:0 auto}\n  .card{background:var(--bg);border-radius:24px;padding:28px 28px 20px}\n  .card.dark{background:var(--dark);color:#F0EFEB}\n  .card.dark .sub{color:#8F8E88}\n  .card.dark .src{color:#55554F}\n  .card.wide{grid-column:1/-1}\n  .split{display:grid;grid-template-columns:250px 1fr;gap:30px;align-items:start}\n  h2{font-weight:700;font-size:16.5px;letter-spacing:-.02em;margin-bottom:3px}\n  .sub{font-size:11.5px;color:var(--muted);margin-bottom:14px}\n  .src{font-size:9.5px;color:var(--faint);margin-top:10px;letter-spacing:.08em;font-weight:500}\n  .note{font-size:11px;color:#6A6963;line-height:1.65;margin-bottom:16px}\n  .legend{font-size:9px;letter-spacing:.1em;font-weight:600;color:var(--muted);line-height:2}\n  svg{width:100%;max-height:330px;display:block;margin:0 auto}\n  svg text{font-family:'Inter',sans-serif}\n  .pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,.7,.3,1.3) both}\n  @keyframes pop{from{transform:scale(0)}to{transform:none}}\n  .fade{animation:fade .9s ease both}\n  @keyframes fade{from{opacity:0}}\n  .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s cubic-bezier(.4,0,.2,1) both}\n  @keyframes draw{to{stroke-dashoffset:0}}\n  @media (prefers-reduced-motion:reduce){\n    .pop,.fade{animation:none}\n    .draw{animation:none;stroke-dasharray:none;stroke-dashoffset:0}\n  }\n\n  .pagehead{max-width:1400px;margin:0 auto 26px;padding:0 4px}\n  .pagehead h1{font-size:22px;letter-spacing:-.02em;font-weight:800}\n  .pagehead p{font-size:12px;color:#8F8E88;margin-top:5px;line-height:1.7}\n  .pagehead .badge{margin:0 2px}\n  .badge{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.08em;\n    padding:3px 10px;border-radius:99px;margin-bottom:10px}\n  .badge.del{background:#1C1C1A;color:#F0EFEB}\n  .badge.pick{border:1.5px solid #1C1C1A;color:#1C1C1A}\n  .badge.pair{border:1px dashed #B0AFA9;color:#8F8E88}\n  .card.dark .badge.del{background:#F0EFEB;color:#1C1C1A}\n  .card.dark .badge.pick{border-color:#F0EFEB;color:#F0EFEB}\n  .card.dark .badge.pair{border-color:#55554F;color:#8F8E88}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"pagehead\">\n\n  \u003ch1>Lupi 系（细读）· 20 张参考实现\u003c/h1>\n  \u003cp>发丝线 · 逐记录 · 30 秒阅读。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"grid2\">\n\n  \u003c!-- 1 · launch fan -->\n  \u003cdiv class=\"card\">\n    \u003ch2>Twelve features, fanned out\u003c/h2>\n    \u003cdiv class=\"sub\">one spoke per feature · big dot = launch week, sized by MAU today · small dots = every week since\u003c/div>\n    \u003csvg id=\"fan\" viewBox=\"0 0 400 320\" preserveAspectRatio=\"xMidYMid meet\">\u003c/svg>\n    \u003cdiv class=\"src\">LAUNCH FAN · MONO-EDITORIAL · PRODUCT ANALYTICS\u003c/div>\n  \u003c/div>\n\n  \u003c!-- 4 · dot cascade on dark -->\n  \u003cdiv class=\"card dark\">\n    \u003ch2>What breaks, stacked and ranked\u003c/h2>\n    \u003cdiv class=\"sub\">incidents by root cause · 2019 → 2026 · one dot = 2 incidents · sorted ascending\u003c/div>\n    \u003csvg id=\"cascade\" viewBox=\"0 0 400 320\" preserveAspectRatio=\"xMidYMid meet\">\u003c/svg>\n    \u003cdiv class=\"src\">DOT CASCADE · MONO-EDITORIAL · INCIDENT LOG\u003c/div>\n  \u003c/div>\n\n  \u003c!-- 2 · barcode lollipop, wide + editorial text column -->\n  \u003cdiv class=\"card wide\">\n    \u003cdiv class=\"split\">\n      \u003cdiv>\n        \u003ch2>Ninety days as a barcode\u003c/h2>\n        \u003cdiv class=\"sub\">peak concurrent users, daily · Apr – Jun 2026\u003c/div>\n        \u003cdiv class=\"note\">Every hairline is a day, whether or not anything\n        happened in it. The dot marks the day's peak; the stem below it is\n        just gravity. Read the field, not the numbers — the season has a\n        texture before it has a value.\u003c/div>\n        \u003cdiv class=\"legend\">\n          ● &nbsp;WEEKDAY PEAK\u003cbr>\n          ○ &nbsp;WEEKEND PEAK\u003cbr>\n          │ &nbsp;ONE CALENDAR DAY\u003cbr>\n          ◉ &nbsp;TOP-3, LABELED\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv>\n        \u003csvg id=\"barcode\" viewBox=\"0 0 800 300\" preserveAspectRatio=\"xMidYMid meet\" style=\"max-height:340px\">\u003c/svg>\n        \u003cdiv class=\"src\">BARCODE LOLLIPOP · MONO-EDITORIAL · LIVE OPS\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003c!-- 3 · arc bubble matrix -->\n  \u003cdiv class=\"card\">\n    \u003ch2>Eight products land in twelve cities\u003c/h2>\n    \u003cdiv class=\"sub\">bubble = paying accounts · each row bows like a horizon\u003c/div>\n    \u003csvg id=\"arcmatrix\" viewBox=\"0 0 430 320\" preserveAspectRatio=\"xMidYMid meet\">\u003c/svg>\n    \u003cdiv class=\"src\">ARC MATRIX · MONO-EDITORIAL · SALES GEO\u003c/div>\n  \u003c/div>\n\n  \u003c!-- 5 · radial convergence -->\n  \u003cdiv class=\"card\">\n    \u003ch2>48 requests pull toward five themes\u003c/h2>\n    \u003cdiv class=\"sub\">every rim node = a feature request · lines bundle into the theme that claimed it\u003c/div>\n    \u003csvg id=\"converge\" viewBox=\"0 0 400 320\" preserveAspectRatio=\"xMidYMid meet\">\u003c/svg>\n    \u003cdiv class=\"src\">RADIAL CONVERGENCE · MONO-EDITORIAL · FEEDBACK BOARD\u003c/div>\n  \u003c/div>\n\n  \u003c!-- 6 · cluster field, wide -->\n  \u003cdiv class=\"card wide\">\n    \u003ch2>The contributor field\u003c/h2>\n    \u003cdiv class=\"sub\">80 core contributors orbit the main repo · satellite islands keep their own gravity · dotted paths = cross-contribution\u003c/div>\n    \u003csvg id=\"clusters\" viewBox=\"0 0 840 320\" preserveAspectRatio=\"xMidYMid meet\" style=\"max-height:360px\">\u003c/svg>\n    \u003cdiv class=\"src\">CLUSTER FIELD · MONO-EDITORIAL · CONTRIBUTOR GRAPH\u003c/div>\n  \u003c/div>\n\n\n\n  \u003c!-- 1 · brand spectrum -->\n  \u003cdiv class=\"card\">\n    \u003ch2>Where the brand sits\u003c/h2>\n    \u003cdiv class=\"sub\">panel of 120 customers placed us between opposing traits · big dot = us · small dots = competitors\u003c/div>\n    \u003csvg id=\"spectrum\" viewBox=\"0 0 460 300\" preserveAspectRatio=\"xMidYMid meet\">\u003c/svg>\n    \u003cdiv class=\"src\">BRAND SPECTRUM · MONO-EDITORIAL2 · BRAND SURVEY\u003c/div>\n  \u003c/div>\n\n  \u003c!-- 2 · dotty matrix -->\n  \u003cdiv class=\"card\">\n    \u003ch2>Four squads, stacked in space\u003c/h2>\n    \u003cdiv class=\"sub\">each plane = one squad · 6 × 6 weeks of activity · dot area = tasks closed\u003c/div>\n    \u003csvg id=\"dotty\" viewBox=\"0 0 400 372\" preserveAspectRatio=\"xMidYMid meet\" style=\"max-height:340px\">\u003c/svg>\n    \u003cdiv class=\"src\">DOTTY MATRIX · MONO-EDITORIAL2 · SPRINT BOARD\u003c/div>\n  \u003c/div>\n\n  \u003c!-- 3 · ticket almanac, wide -->\n  \u003cdiv class=\"card wide\">\n    \u003ch2>Eight years of tickets, one almanac\u003c/h2>\n    \u003cdiv class=\"sub\">bubble area = support tickets per product area, per year · bubbles overlap where years pile up · dark core = escalations · dashed ring = still in beta\u003c/div>\n    \u003csvg id=\"almanac\" viewBox=\"0 0 840 400\" preserveAspectRatio=\"xMidYMid meet\" style=\"max-height:420px\">\u003c/svg>\n    \u003cdiv class=\"src\">BUBBLE ALMANAC · MONO-EDITORIAL2 · SUPPORT DESK\u003c/div>\n  \u003c/div>\n\n  \u003c!-- 4 · deploy patchwork -->\n  \u003cdiv class=\"card\">\n    \u003ch2>A quarter of deploys, overlaid\u003c/h2>\n    \u003cdiv class=\"sub\">each wedge = one deploy · angle = time of day · reach = files touched · ink builds where deploys pile up\u003c/div>\n    \u003csvg id=\"patchwork\" viewBox=\"0 0 400 320\" preserveAspectRatio=\"xMidYMid meet\">\u003c/svg>\n    \u003cdiv class=\"src\">RADIAL PATCHWORK · MONO-EDITORIAL2 · DEPLOY LOG\u003c/div>\n  \u003c/div>\n\n  \u003c!-- 6 · trend lineage -->\n  \u003cdiv class=\"card\">\n    \u003ch2>Features rise, fall, come back\u003c/h2>\n    \u003cdiv class=\"sub\">● shipped · ○ reworked · dashed = dormant years · line runs on if it's still alive today\u003c/div>\n    \u003csvg id=\"lineage\" viewBox=\"0 0 400 340\" preserveAspectRatio=\"xMidYMid meet\">\u003c/svg>\n    \u003cdiv class=\"src\">TREND LINEAGE · MONO-EDITORIAL2 · PRODUCT HISTORY\u003c/div>\n  \u003c/div>\n\n  \u003c!-- 8 · type colonnade -->\n  \u003cdiv class=\"card\">\n    \u003ch2>Forty-four repos, ten owners\u003c/h2>\n    \u003cdiv class=\"sub\">every hairline hands a repo to the team that owns it · the pile-ups are the org chart nobody drew\u003c/div>\n    \u003csvg id=\"colonnade\" viewBox=\"0 0 400 320\" preserveAspectRatio=\"xMidYMid meet\">\u003c/svg>\n    \u003cdiv class=\"src\">TYPE COLONNADE · MONO-EDITORIAL2 · CODE OWNERSHIP\u003c/div>\n  \u003c/div>\n\n  \u003c!-- 9 · funnel hourglass -->\n  \u003cdiv class=\"card\">\n    \u003ch2>The funnel, poured\u003c/h2>\n    \u003cdiv class=\"sub\">each strip's width = people at that stage · threads trickle down · Q2 2026 cohort\u003c/div>\n    \u003csvg id=\"hourglass\" viewBox=\"0 0 400 330\" preserveAspectRatio=\"xMidYMid meet\">\u003c/svg>\n    \u003cdiv class=\"src\">HOURGLASS STREAM · MONO-EDITORIAL2 · GROWTH\u003c/div>\n  \u003c/div>\n\n  \u003c!-- 14 · hundred field -->\n  \u003cdiv class=\"card\">\n    \u003cspan class=\"badge pair\">小数据 · 单位分解\u003c/span>\n    \u003ch2>A hundred of us, four minds\u003c/h2>\n    \u003cdiv class=\"sub\">one dot = one person in a hundred · four attitude clusters, sized by share · 2026 survey\u003c/div>\n    \u003csvg id=\"hundredfield\" viewBox=\"0 0 400 320\" preserveAspectRatio=\"xMidYMid meet\">\u003c/svg>\n    \u003cdiv class=\"src\">HUNDRED FIELD · MONO-SMALL · ATTITUDE SURVEY\u003c/div>\n  \u003c/div>\n\n  \u003c!-- 15 · ballot tally -->\n  \u003cdiv class=\"card\">\n    \u003cspan class=\"badge pair\">小数据 · 单位分解\u003c/span>\n    \u003ch2>What they fear, tick by tick\u003c/h2>\n    \u003cdiv class=\"sub\">one tick = one respondent in a hundred · inked = picked it · they could pick several\u003c/div>\n    \u003csvg id=\"ballottally\" viewBox=\"0 0 400 320\" preserveAspectRatio=\"xMidYMid meet\">\u003c/svg>\n    \u003cdiv class=\"src\">BALLOT TALLY · MONO-SMALL · WORKPLACE SURVEY\u003c/div>\n  \u003c/div>\n\n\n  \u003c!-- L16 · matrix heat -->\n  \u003cdiv class=\"card\">\n    \u003cspan class=\"badge\">LUPI 编辑型 · 矩阵热力\u003c/span>\n    \u003ch2>Which features get used together\u003c/h2>\n    \u003cdiv class=\"sub\">8 × 8 co-usage · shade = share of accounts using both · dashed square = strongest pair\u003c/div>\n    \u003csvg id=\"matheat\" viewBox=\"0 0 400 320\" preserveAspectRatio=\"xMidYMid meet\">\u003c/svg>\n    \u003cdiv class=\"src\">MATRIX HEAT · MONO-EDITORIAL · PRODUCT ANALYTICS\u003c/div>\n  \u003c/div>\n\n  \u003c!-- L17 · calendar heat -->\n  \u003cdiv class=\"card wide\">\n    \u003cspan class=\"badge\">LUPI 编辑型 · 日历热力\u003c/span>\n    \u003ch2>A year of deploys, day by day\u003c/h2>\n    \u003cdiv class=\"sub\">52 weeks × 7 days · dot area = deploys that day · tiny dot = a quiet day · dashed ring = the busiest day of 2025\u003c/div>\n    \u003csvg id=\"calheat\" viewBox=\"0 0 840 232\" preserveAspectRatio=\"xMidYMid meet\" style=\"max-height:260px\">\u003c/svg>\n    \u003cdiv class=\"src\">CALENDAR HEAT · MONO-EDITORIAL · DEPLOY LOG\u003c/div>\n  \u003c/div>\n\n  \u003c!-- L18 · beeswarm -->\n  \u003cdiv class=\"card\">\n    \u003cspan class=\"badge\">LUPI 编辑型 · 蜂群\u003c/span>\n    \u003ch2>A hundred and twenty deals, swarming\u003c/h2>\n    \u003cdiv class=\"sub\">one dot = one closed deal · the swarm piles up where deals cluster · hollow = enterprise · dashed = median\u003c/div>\n    \u003csvg id=\"beeswarm\" viewBox=\"0 0 400 320\" preserveAspectRatio=\"xMidYMid meet\">\u003c/svg>\n    \u003cdiv class=\"src\">BEESWARM · MONO-EDITORIAL · SALES OPS\u003c/div>\n  \u003c/div>\n\n  \u003c!-- L19 · ridgeline -->\n  \u003cdiv class=\"card\">\n    \u003cspan class=\"badge\">LUPI 编辑型 · RIDGELINE\u003c/span>\n    \u003ch2>Five pipelines, five tempos\u003c/h2>\n    \u003cdiv class=\"sub\">each crest = one pipeline's completion-time shape · the area is made of hairlines · dot = the peak\u003c/div>\n    \u003csvg id=\"ridge\" viewBox=\"0 0 400 320\" preserveAspectRatio=\"xMidYMid meet\">\u003c/svg>\n    \u003cdiv class=\"src\">RIDGELINE · MONO-EDITORIAL · DATA PLATFORM\u003c/div>\n  \u003c/div>\n\n  \u003c!-- L20 · parallel coordinates -->\n  \u003cdiv class=\"card\">\n    \u003cspan class=\"badge\">LUPI 编辑型 · 平行坐标\u003c/span>\n    \u003ch2>Twelve products, four dimensions\u003c/h2>\n    \u003cdiv class=\"sub\">one hairline = one product across price · satisfaction · retention · growth · ink = the one that wins everywhere\u003c/div>\n    \u003csvg id=\"parallel\" viewBox=\"0 0 400 320\" preserveAspectRatio=\"xMidYMid meet\">\u003c/svg>\n    \u003cdiv class=\"src\">PARALLEL COORDS · MONO-EDITORIAL · PRODUCT PANEL\u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\u003cscript>\n// ── shared Mono tokens ──\nconst INK='#1C1C1A',PAPER='#F0EFEB',MUTED='#8F8E88',GRID='#DEDDD6';\nconst NS='http://www.w3.org/2000/svg';\nconst el=(p,t,a)=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);p.appendChild(n);return n};\nconst txt=(p,a,s)=>{const n=el(p,'text',a);n.textContent=s;return n};\nconst tip=(n,s)=>{const t=document.createElementNS(NS,'title');t.textContent=s;n.appendChild(t)};\nconst rnd=(i,k)=>Math.abs(((i*73856093)^(k*19349663))%1000)/1000; // deterministic\nconst D2R=Math.PI/180;\nconst pol=(cx,cy,r,deg)=>[cx+r*Math.cos(deg*D2R),cy+r*Math.sin(deg*D2R)];\nconst sect=(cx,cy,r0,r1,a0,a1)=>{\n  const big=a1-a0>180?1:0;\n  const [xa,ya]=pol(cx,cy,r1,a0),[xb,yb]=pol(cx,cy,r1,a1);\n  const [xc,yc]=pol(cx,cy,r0,a1),[xd,yd]=pol(cx,cy,r0,a0);\n  return `M${xa} ${ya} A${r1} ${r1} 0 ${big} 1 ${xb} ${yb} L${xc} ${yc} A${r0} ${r0} 0 ${big} 0 ${xd} ${yd} Z`;\n};\n// unified reveal: draw when scrolled into view; click replays\nconst obsReveal=(id,fn)=>{\n  const n=document.getElementById(id);\n  const go=()=>{n.innerHTML='';fn(n)};\n  const io=new IntersectionObserver(es=>{if(es[0].isIntersecting){go();io.disconnect()}},{threshold:.3});\n  io.observe(n);\n  n.style.cursor='pointer';\n  n.addEventListener('click',go);\n};\n\n// ════ 1 · launch fan ════\n// spokes sorted by launch week → the big dots cascade along a diagonal arc\n(()=>{\nconst FEAT=['Editor','Boards','Docs','Chat','Flows','Vault','Pages','Sync','Grid','Views','Hub','Forms'];\nconst LAUNCH=[1,3,4,6,8,9,11,12,14,16,17,19];     // week of launch\nconst CX=40,CY=304,rOf=w=>56+w*9.7;\nobsReveal('fan',s=>{\n  const ang=i=>-84+i*(76/11);\n  // dotted week guides\n  [5,10,15,20].forEach((w,gi)=>{\n    const r=rOf(w),[x1,y1]=pol(CX,CY,r,-84),[x2,y2]=pol(CX,CY,r,-8);\n    el(s,'path',{d:`M${x1} ${y1} A${r} ${r} 0 0 1 ${x2} ${y2}`,fill:'none',\n      stroke:'#D8D6CE','stroke-width':1,'stroke-dasharray':'2 5',\n      class:'fade',style:`animation-delay:${gi*.1}s`});\n    const [lx,ly]=pol(CX,CY,r,-87.5);\n    txt(s,{x:lx,y:ly,'font-size':6.5,fill:'#B0AFA9','text-anchor':'middle',\n      class:'fade',style:`animation-delay:${gi*.1}s`},'W'+w);\n  });\n  FEAT.forEach((name,i)=>{\n    const a=ang(i),L=LAUNCH[i];\n    const mau=Math.round(48-i*3+rnd(i+1,3)*10);\n    // hairline spoke from launch to rim\n    const [sx,sy]=pol(CX,CY,rOf(L),a),[ex,ey]=pol(CX,CY,rOf(20),a);\n    el(s,'line',{x1:sx,y1:sy,x2:ex,y2:ey,stroke:'#E3E2DB','stroke-width':.7,\n      class:'fade',style:`animation-delay:${.15+i*.05}s`});\n    // weekly texture dots\n    for(let w=L+1;w\u003c=20;w++){\n      const [x,y]=pol(CX,CY,rOf(w),a);\n      el(s,'circle',{cx:x,cy:y,r:1.1+rnd(i+1,w)*1.2,fill:'#B0AFA9',opacity:.8,\n        class:'pop',style:`animation-delay:${.2+i*.06+(w-L)*.015}s`});\n    }\n    // launch dot, sized by MAU\n    const [bx,by]=pol(CX,CY,rOf(L),a);\n    const big=el(s,'circle',{cx:bx,cy:by,r:Math.sqrt(mau)*1.15,fill:INK,\n      class:'pop',style:`animation-delay:${.15+i*.07}s`});\n    tip(big,`${name} — launched W${L} · ${mau}k MAU`);\n    // rim label along the spoke\n    const [tx,ty]=pol(CX,CY,rOf(20)+9,a);\n    txt(s,{x:tx,y:ty,'font-size':7,'font-weight':600,fill:'#6A6963',\n      transform:`rotate(${a} ${tx} ${ty})`,'dominant-baseline':'middle',\n      class:'fade',style:`animation-delay:${.3+i*.05}s`},name);\n  });\n});\n})();\n\n// ════ 4 · dot cascade on dark ════\n(()=>{\nconst CAUSE=['DNS','CDN','QUOTA','DISK','CERT','CACHE','QUEUE','LOCK','OOM','NET','3P API','CONFIG','DB','DEPLOY','CODE','HUMAN'];\nconst COUNT=[1,1,2,3,3,4,5,6,7,9,11,13,15,18,22,27];\nobsReveal('cascade',s=>{\n  const x=i=>34+i*22.2, base=i=>272-i*7.5;\n  // dotted diagonal baseline\n  el(s,'line',{x1:x(0)-8,y1:base(0)+4,x2:x(15)+8,y2:base(15)+4,\n    stroke:'#4A4944','stroke-width':1,'stroke-dasharray':'2 4',class:'fade'});\n  CAUSE.forEach((name,i)=>{\n    const n=Math.ceil(COUNT[i]/2),bx=x(i),by=base(i);\n    for(let k=0;k\u003cn-1;k++)\n      el(s,'circle',{cx:bx,cy:by-12-k*8.8,r:2.2,fill:'#B3B0A4',opacity:.9,\n        class:'pop',style:`animation-delay:${i*.05+k*.03}s`});\n    const topY=by-12-(n-1)*8.8;\n    const top=el(s,'circle',{cx:bx,cy:topY,r:4.6,fill:PAPER,\n      class:'pop',style:`animation-delay:${i*.05+n*.03}s`});\n    tip(top,`${name} — ${COUNT[i]} :'fade'},m));\n});\n})();\n\n// ════ 3 · arc bubble matrix ════\n(()=>{\nconst PROD=['Editor','Boards','Docs','Flows','Chat','Vault','Pages','Sync'];\nconst CITY=['SF','NYC','LON','BER','TOK','SYD','SIN','PAR','AMS','TOR','SEO','SAO'];\nconst W=[9,8,7,7,6,5,5,4,4,3,3,2];             // market weight\nobsReveal('arcmatrix',s=>{\n  const rowY=i=>74+i*29, colX=j=>92+j*27, dy=j=>-16*Math.sin(Math.PI*j/11);\n  const v=(i,j)=>{\n    if(rnd(i*13+1,j*7+3)\u003c.09)return 0;                 // a few true absences\n    const age=1-i*.085;                                // older rows reach further\n    return Math.min(40,Math.round(W[j]*3.4*age*(.45+rnd(i+1,j+1)*.85)));\n  };\n  // find top-4 cells for labels\n  const all=[];\n  PROD.forEach((_,i)=>CITY.forEach((_,j)=>all.push([v(i,j),i,j])));\n  const top=all.sort((a,b)=>b[0]-a[0]).slice(0,4).map(d=>d[1]*100+d[2]);\n  PROD.forEach((p,i)=>{\n    // the horizon arc\n    const d='M'+CITY.map((_,j)=>`${colX(j)} ${rowY(i)+dy(j)}`).join(' L ');\n    el(s,'path',{d,fill:'none',stroke:'#E3E2DB','stroke-width':1,pathLength:1,\n      class:'draw',style:`animation-delay:${i*.08}s`});\n    txt(s,{x:84,y:rowY(i)+3,'font-size':8,'font-weight':600,fill:'#6A6963','text-anchor':'end',\n      class:'fade',style:`animation-delay:${i*.08}s`},p);\n    CITY.forEach((c,j)=>{\n      const x=colX(j),y=rowY(i)+dy(j),vv=v(i,j);\n      if(!vv){el(s,'circle',{cx:x,cy:y,r:.9,fill:'#D8D6CE',\n        class:'pop',style:`animation-delay:${.2+i*.08+j*.02}s`});return}\n      const fill=vv>=25?INK:vv>=12?'#6A6963':'#B0AFA9';\n      const dot=el(s,'circle',{cx:x,cy:y,r:Math.sqrt(vv)*1.3,fill,\n        class:'pop',style:`animation-delay:${.2+i*.08+j*.02}s`});\n      tip(dot,`${p} · ${c} — ${vv} accounts`);\n      if(top.includes(i*100+j))\n        txt(s,{x,y:y-Math.sqrt(vv)*1.3-4,'font-size':7,'font-weight':800,fill:INK,\n          'text-anchor':'middle',class:'fade',style:`animation-delay:${.6}s`},vv);\n    });\n  });\n  CITY.forEach((c,j)=>{\n    const x=colX(j -width':.6,opacity:.6,pathLength:1,\n      class:'draw',style:`animation-delay:${.2+i*.015}s;animation-duration:.7s`});\n  }\n  TEAM.forEach((t,j)=>{\n    const y=teamY(j);\n    el(s,'circle',{cx:293,cy:y,r:2.6+counts[j]*.55,fill:counts[j]>=7?INK:counts[j]>=4?'#6A6963':'#B0AFA9',\n      class:'pop',style:`animation-delay:${.6+j*.05}s`});\n    const lab=txt(s,{x:302+counts[j]*.55,y:y+2.5,'font-size':7,'font-weight':700,fill:'#4A4944',\n      class:'fade',style:`animation-delay:${.65+j*.05}s`},`${t} · ${counts[j]}`);\n    tip(lab,`${t} owns ${counts[j]} repos`);\n  });\n});\n})();\n\n// ════ 9 · hourglass stream ════\n(()=>{\nconst STAGE=[['VISITORS',4200],['SIGN-UPS',1900],['ACTIVATED',960],['RETAINED',540],['PAYING',310]];\nobsReveal('hourglass',s=>{\n  const CXm=185,sy=k=>34+k*64,w=c=>c/4200*290;\n  STAGE.forEach(([name,c],k)=>{\n    const y=sy(k),hw=w(c)/2;\n    // barcode strip: one tick ≈ 40 people\n    const n=Math.round(c/40);\n    for(let t=0;t\u003cn;t++){\n      const x=CXm-hw+(t+.5)/n*hw*2+(rnd(t+1,k+3)-.5)*3;\n      el(s,'line',{x1:x,y1:y-6,x2:x,y2:y+6,stroke:INK,'stroke-width':.8,\n        opacity:.45+rnd(t+2,k+5)*.5,class:'fade',style:`animation-delay:${k*.12+t*.004}s`});\n    }\n    // threads trickling to the next strip\n    if(k\u003c4){\n      const hw1=w(STAGE[k+1][1])/2;\n      for(let t=0;t\u003c34;t++){\n        const xt=CXm+(rnd(t+1,k*7+1)-.5)*2*hw*.94;\n        const xb=CXm+(rnd(t+3,k*7+5)-.5)*2*hw1*.94;\n        el(s,'path',{d:`M${xt} ${y+8} C${xt} ${y+34} ${xb} ${sy(k+1)-34} ${xb} ${sy(k+1)-8}`,\n          fill:'none',stroke:'#B0AFA9','stroke-width':.5,opacity:.32,pathLength:1,\n          class:'draw',style:`animation-delay:${.2+k*.15+t*.008}s;animation-duration:.8s`});\n      }\n      // conversion between stages, parked in the left margin\n      const pct=Math.round(STAGE[k+1][1]/c*100);\n      txt(s,{x:26,y:(y+sy(k+1))/2+3,'font-size':8.5,'font-weight':800,fill:'#8F8E88',\n        class:'fade',style:`animation-delay:${.5+k*.15}s`},pct+'%');\n      txt(s,{x:26,y:(y+sy(k+1))/2+13,'font-size':6,'font-weight':600,fill:'#C6C5BF',\n        'letter-spacing':'.08em',class:'fade',style:`animation-delay:${.5+k*.15}s`},'GET THROUGH');\n    }\n    // stage label, tied to the strip edge\n    el(s,'line',{x1:CXm+hw+6,y1:y,x2:340,y2:y,stroke:'#DEDDD6','stroke-width':.8,\n      class:'fade',style:`animation-delay:${.3+k*.12}s`});\n    txt(s,{x:344,y:y-1,'font-size':7.5,'font-weight':700,fill:'#4A4944',\n      'letter-spacing':'.08em',class:'fade',style:`animation-delay:${.35+k*.12}s`},name);\n    txt(s,{x:344,y:y+10,'font-size':9.5,'font-weight':800,fill:INK,\n      class:'fade',style:`animation-delay:${.4+k*.12}s`},c.toLocaleString());\n  });\n});\n})();\n\n// ════ 14 · hundred field ════\n// small data, unit-decomposed: four shares of 100% become 100 people.\n// phyllotaxis discs (golden angle) so每簇自带肌理; share is countable, not just readable.\n(()=>{\nconst SEG=[['CHARGED',41,INK],['TORN',35,'#55554F'],['ADRIFT',12,'#8F8E88'],['AVERSE',12,'#B0AFA9']];\nconst POS=[[132,140],[276,116],[186,252],[322,238]];\nobsReveal('hundredfield',s=>{\n  // dashed constellation hairlines tying the cluster cores\n  [[0,1],[0,2],[1,3],[2,3]].forEach(([a,b],k)=>{\n    el(s,'line',{x1:POS[a][0],y1:POS[a][1],x2:POS[b][0],y2:POS[b][1],\n      stroke:GRID,'stroke-width':.7,'stroke-dasharray':'2 5',\n      class:'fade',style:`animation-delay:${.9+k*.1}s`});\n  });\n  SEG.forEach(([name,v,shade],ci)=>{\n    const [cx,cy]=POS[ci];\n    let edge=0;\n    for(let k=0;k\u003cv;k++){\n      const a=k*137.508+ci*55;\n      const rr=4+Math.sqrt(k)*5.9+rnd(k+1,ci+2)*3;\n      edge=Math.max(edge,rr);\n      const [x,y]=pol(cx,cy,rr,a);\n      // hairline spoke for every 5th person, core to dot\n      if(k%5===0)el(s,'line',{x1:cx,y1:cy,x2:x,y2:y,stroke:'#CDCCC5','stroke-width':.6,\n        class:'fade',style:`animation-delay:${ci*.14+k*.012}s`});\n      const dot=el(s,'circle',{cx:x,cy:y,r:1.5+rnd(k+2,ci+3)*1.7,fill:shade,opacity:.9,\n        class t-order:stroke;stroke:${PAPER};stroke-width:3px;animation-delay:${.5+i*.1}s`,\n      class:'fade'},v);\n    tip(lab,`${v} of 100 picked this — they could pick several`);\n  });\n  txt(s,{x:200,y:314,'font-size':7,'font-weight':600,fill:'#B0AFA9','text-anchor':'middle',\n    'letter-spacing':'.12em',class:'fade',style:'animation-delay:1.1s'},'ONE TICK = ONE RESPONDENT · DOT MARKS EVERY TENTH');\n});\n})();\n\n\n// ── New chart-family helpers (scoped to the added templates) ──\n(()=>{\nconst INK='#1C1C1A',PAPER='#F0EFEB',MUTED='#8F8E88',GRID='#DEDDD6';\nconst NS='http://www.w3.org/2000/svg';\nconst el=(p,t,a)=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);p.appendChild(n);return n};\nconst txt=(p,a,s)=>{const n=el(p,'text',a);n.textContent=s;return n};\nconst tip=(n,s)=>{const t=document.createElementNS(NS,'title');t.textContent=s;n.appendChild(t)};\nconst rnd=(i,k)=>Math.abs(((i*73856093)^(k*19349663))%1000)/1000;\n\n// ════ L16 · matrix heat ════\n// 通用矩阵热力：任意 分类×分类×连续值。明度即数据——五档灰阶方块，\n// 越黑越高。对角线不参与（自己×自己），零格留一粒小点（沉默可见）。\n// 最强的一对上虚线框 + 标数。区别于 F10 dot heat：这里编码用明度不用面积，\n// 值是占比/强度而不是可数件数。\n(()=>{\nconst FEAT=['EDITOR','BOARDS','DOCS','CHAT','FLOWS','VAULT','PAGES','SYNC'];\nconst v=(i,j)=>{\n  if(i===j)return -1;\n  const a=Math.min(i,j),b=Math.max(i,j);\n  const pop=(8-a)/8*(8-b)/8;                       // 头部功能重合度高\n  const raw=pop*62*(0.35+rnd(a*8+b+1,a+b+3)*.9);\n  return Math.round(raw);\n};\nconst shade=t=>t>36?INK:t>24?'#4A4944':t>14?'#8F8E88':t>6?'#B0AFA9':'#D8D7D1';\nobsReveal('matheat',s=>{\n  const X0=118,Y0=70,P=26,C=22;\n  let max=0,mi=0,mj=0;\n  for(let i=0;i\u003c8;i++)for(let j=0;j\u003c8;j++){const t=v(i,j);if(t>max){max=t;mi=i;mj=j}}\n  FEAT.forEach((f,i)=>{\n    txt(s,{x:X0-10,y:Y0+i*P+C/2+3,'font-size':7,'font-weight':700,fill:'#6A6963','text-anchor':'end',\n      'letter-spacing':'.06em',class:'fade',style:`animation-delay:${i*.04}s`},f);\n    const cy=Y0-10;\n    txt(s,{x:X0+i*P+C/2,y:cy,'font-size':7,'font-weight':700,fill:MUTED,'letter-spacing':'.06em',\n      transform:`rotate(-55 ${X0+i*P+C/2} ${cy})`,class:'fade',style:`animation-delay:${i*.04}s`},f);\n  });\n  for(let i=0;i\u003c8;i++)for(let j=0;j\u003c8;j++){\n    const x=X0+j*P,y=Y0+i*P,t=v(i,j),d=(i+j)*.02;\n    if(t\u003c0){el(s,'rect',{x:x+C/2-3,y:y+C/2-.6,width:6,height:1.2,fill:'#D8D6CE',\n      class:'fade',style:`animation-delay:${d}s`});continue}\n    if(!t){el(s,'circle',{cx:x+C/2,cy:y+C/2,r:.9,fill:'#D8D6CE',\n      class:'pop',style:`animation-delay:${d}s`});continue}\n    const cell=el(s,'rect',{x,y,width:C,height:C,rx:4,fill:shade(t),\n      class:'pop',style:`animation-delay:${d}s`});\n    tip(cell,`${FEAT[i]} × ${FEAT[j]} — ${t}% of accounts use both`);\n    if(i===mi&&j===mj){\n      el(s,'rect',{x:x-3.5,y:y-3.5,width:C+7,height:C+7,rx:6,fill:'none',\n        stroke:INK,'stroke-width':1,'stroke-dasharray':'2 3',\n        class:'fade',style:'animation-delay:.9s'});\n      txt(s,{x:x+C/2,y:y+C/2+3.5,'font-size':9,'font-weight':800,fill:PAPER,'text-anchor':'middle',\n        class:'fade',style:'animation-delay:1s'},t);\n    }\n  }\n  // shade legend, countable buckets\n  const LG=[['#D8D7D1','1–6'],['#B0AFA9','7–14'],['#8F8E88','15–24'],['#4A4944','25–36'],[INK,'37+']];\n  LG.forEach(([c,lab],k)=>{\n    const x=118+k*54;\n    el(s,'rect',{x,y:292,width:9,height:9,rx:2,fill:c,class:'fade',style:`animation-delay:${1+k*.05}s`});\n    txt(s,{x:x+13,y:300,'font-size':6.5,'font-weight':600,fill:'#8F8E88',\n      class:'fade',style:`animation-delay:${1+k*.05}s`},lab+'%');\n  });\n  txt(s,{x:36,y:300,'font-size':7,'font-weight':600,fill:'#B0AFA9','letter-spacing':'.1em',\n    class:'fade',style:'animation-delay:1s'},'SHADE = %');\n});\n})();\n\n// ════ L17 · calendar heat ════\n// 日历热力：GitHub 贡献墙的 Lupi 皮。一格一天，52 周 × 7 天，\n// 点面积 = 当天量（sqrt 换算），静默日一粒小点。月份写在上檐，\n// 峰值日虚线圈 + 旁注引线。逐记录世界观：一年 365 天每天都在场。\n(()=>{\nconst MON=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];\nconst DAY=['MON','WED','FRI','SUN'];\nconst val=(w,d)=>{\n  const wd=d\u003c5;\n  const season=1+.55*Math.sin((w-8)/9);            // 春秋两个发布季\n  if(!wd)return rnd(w*7+d+1,3)>.82?1:0;            // 周末基本静默\n  const raw=season*(2.5+rnd(w*7+d+1,d+2)*9)*(rnd(w+1,d+5)>.12?1:0);\n  return Math.round(raw);\n};\nobsReveal('calheat',s=>{\n  const X0=56,Y0=42,P=14.8;\n  let max=0,mw=0,md=0;\n  for(let w=0;w\u003c52;w++)for(let d=0;d\u003c7;d++){const t=val(w,d);if(t>max){max=t;mw=w;md=d}}\n  DAY.forEach((lab,k)=>{\n    txt(s,{x:X0-10,y:Y0+[0,2,4,6][k]*P+3,'font-size':6.5,'font-weight':700,fill:'#8F8E88','text-anchor':'end',\n      'letter-spacing':'.06em',class:'fade',style:`animation-delay:${k*.04}s`},lab);\n  });\n  MON.forEach((m,k)=>{\n    const x=X0+Math.round(k*52/12)*P;\n    txt(s,{x,y:Y0-16,'font-size':7,'font-weight':700,fill:MUTED,'letter-spacing':'.1em',\n      class:'fade',style:`animation-delay:${k*.03}s`},m);\n    el(s,'line',{x1:x,y1:Y0-11,x2:x,y2:Y0-5,stroke:'#C6C5BF','stroke-width':.7,\n      class:'fade',style:`animation-delay:${k*.03}s`});\n  });\n  for(let w=0;w\u003c52;w++)for(let d=0;d\u003c7;d++){\n    const x=X0+w*P,y=Y0+d*P,t=val(w,d),delay=w*.012+d*.004;\n    if(!t){el(s,'circle',{cx:x,cy:y,r:.75,fill:'#D8D6CE',\n      class:'pop',style:`animation-delay:${delay}s`});continue}\n    const r=1.1+Math.sqrt(t)*1.55;\n    const dot=el(s,'circle',{cx:x,cy:y,r,\n      fill:t>max*.66?INK:t>max*.33?'#6A6963':'#B0AFA9',\n      class:'pop',style:`animation-delay:${delay}s`});\n    tip(dot,`W${w+1} ${['MON','TUE','WED','THU','FRI','SAT','SUN'][d]} — ${t} deploys`);\n  }\n  // peak: dashed ring + marginalia hairline\n  const px=X0+mw*P,py=Y0+md*P,pr=1.1+Math.sqrt(max)*1.55;\n  el(s,'circle',{cx:px,cy:py,r:pr+3.6,fill:'none',stroke:INK,'stroke-width':1,\n    'stroke-dasharray':'2 3',class:'fade',style:'animation-delay:1s'});\n  el(s,'path',{d:`M${px+pr+6} ${py+6} C${px+34} ${py+30} ${px+52} ${py+36} ${px+72} ${py+36}`,\n    fill:'none',stroke:'#B0AFA9','stroke-width':.7,class:'fade',style:'animation-delay:1.1s'});\n  txt(s,{x:px+78,y:py+39,'font-size':7,fill:'#6A6963','font-style':'italic',\n    class:'fade',style:'animation-delay:1.15s'},`the release-week spike — ${max} deploys in a day`);\n  txt(s,{x:420,y:222,'font-size':7,'font-weight':600,fill:'#B0AFA9','text-anchor':'middle',\n    'letter-spacing':'.12em',class:'fade',style:'animation-delay:1.2s'},\n    'ONE DOT = ONE DAY · DOT AREA = DEPLOYS · TINY DOT = A QUIET DAY');\n});\n})();\n\n// ════ L18 · beeswarm ════\n// 蜂群：violin 的 Lupi 姊妹。不聚合密度，把 120 条真实记录沿数值轴\n// 逐颗排开，撞上了就往两边让——堆得高的地方就是分布的峰。\n// 空心 = enterprise 单，虚线 = 中位数。每颗点背后是一条真实成交。\n(()=>{\nconst N=120;\nconst deals=Array.from({length:N},(_,i)=>{\n  const u=rnd(i+1,3),ent=rnd(i+2,11)>.86;\n  const v=Math.round(4+(ent?60:6)+150*Math.pow(u,2.6)+rnd(i+3,7)*10);\n  return [Math.min(178,v),ent];\n});\nobsReveal('beeswarm',s=>{\n  const X0=36,X1=376,BASE=246,R=4,GAP=R*2+.8;\n  const mapX=v=>X0+v/180*(X1-X0);\n  // axis rail + barcode ticks\n  el(s,'line',{x1:X0-4,y1:BASE,x2:X1+4,y2:BASE,stroke:GRID,'stroke-width':.8,class:'fade'});\n  for(let g=0;g\u003c=9;g++){\n    const x=X0+g/9*(X1-X0);\n    el(s,'line',{x1:x,y1:BASE,x2:x,y2:BASE+(g%3===0?7:4),stroke:'#CFCEC7','stroke-width':.6,\n      class:'fade',style:`animation-delay:${g*.02}s`});\n    if(g%3===0)txt(s,{x,y:BASE+18,'font-size':7,'font-weight':600,fill:'#C6C5BF','text-anchor':'middle',\n      class:'fade',style:`animation-delay:${g*.02}s`},'$'+Math.round(g/9*180)+'k');\n  }\n  // swarm as clean stacks: x snaps to a GAP-wide lane, dots pile upward —\n  // the pile height IS the density. no half-overlaps, every dot countable.\n  const lanes={};\n  const sorted=deals.map((d,i)=>[d[0],d[1],i]).sort((a,b)=>a[0]-b[0]);\n  sorted.forEach(([v,ent,i])=>{\n    const lane=Math.round((mapX(v)-X0)/GAP);\n    const x=X0+lane*GAP;\n    const row=lanes[lane]||0;lanes[lane]=row+1;\n    const y=BASE-R-1-row*GAP;\n    const dot=ent\n      ?el(s,'circle',{cx:x,cy:y,r:R,fill:PAPER,stroke:INK,'stroke-width':1.1,\n        class:'pop',style:`animation-delay:${.1+i*.007}s`})\n      :el(s,'circle',{cx:x,cy:y,r:R,fill:INK,opacity:.82,\n        class:'pop',style:`animation-delay:${.1+i*.007}s`});\n    tip(dot,`deal #${i+1} — $${v}k${ent?' · enterprise':''}`);\n  });\n  // median\n  const vs=deals.map(d=>d[0]).sort((a,b)=>a-b);\n  const med=vs[Math.floor(N/2)];\n  const mx=mapX(med);\n  el(s,'line',{x1:mx,y1:52,x2:mx,y2:BASE+8,stroke:'#8F8E88','stroke-width':.9,\n    'stroke-dasharray':'2 4',class:'fade',style:'animation-delay:1s'});\n  txt(s,{x:mx,y:44,'font-size':9.5,'font-weight':800,fill:INK,'text-anchor':'middle',\n    style:`paint-order:stroke;stroke:${PAPER};stroke-width:3px;animation-delay:1.1s`,\n    class:'fade'},'MEDIAN $'+med+'k');\n  txt(s,{x:200,y:306,'font-size':7,'font-weight':600,fill:'#B0AFA9','text-anchor':'middle',\n    'letter-spacing':'.12em',class:'fade',style:'animation-delay:1.2s'},\n    'ONE DOT = ONE DEAL · THE PILE IS THE DISTRIBUTION · HOLLOW = ENTERPRISE');\n});\n})();\n\n// ════ L19 · ridgeline ════\n// 多组分布的 Lupi 皮：每行一条完成时长的密度山脊，面积由竖发丝组成\n// （F3 hairline area 的语法），行与行轻微重叠，后排画在前、前排糊上\n// 纸色 slab 遮挡（dotty matrix 的手法）。峰值点标中心时长。\n(()=>{\nconst ROWS=[['MOBILE',3.2,1.3],['DESKTOP',5.1,1.9],['API',7.4,2.3],['IMPORTS',10.8,3.2],['BATCH',15.2,4]];\nobsReveal('ridge',s=>{\n  const X0=92,X1=372,MAXH=24,N=72,LIFT=54;\n  const rowY=i=>96+i*44;\n  ROWS.forEach(([name,c,sp],i)=>{\n    const y0=rowY(i);\n    const dens=Array.from({length:N},(_,k)=>{\n      const h=k/(N-1)*MAXH;\n      return Math.exp(-((h-c)**2)/(2*sp*sp))+.26*Math.exp(-((h-c*2.1)**2)/(2*(sp*1.7)**2));\n    });\n    const dmax=Math.max(...dens);\n    const pts=dens.map((d,k)=>[X0+k/(N-1)*(X1-X0),y0-d/dmax*LIFT]);\n    const crest='M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L ');\n    el(s,'path',{d:crest+` L${X1} ${y0} L${X0} ${y0} Z`,fill:PAPER,'fill-opacity':.96,\n      class:'fade',style:`animation-delay:${i*.1}s`});\n    pts.forEach(([px,py],k)=>{\n      if(k%2)return;\n      el(s,'line',{x1:px,y1:y0,x2:px,y2:py,stroke:'#8F8E88','stroke-width':.5,\n        opacity:.28+rnd(k+1,i+3)*.32,class:'fade',style:`animation-delay:${i*.1+k*.004}s`});\n    });\n    el(s,'path',{d:crest,fill:'none',stroke:INK,'stroke-width':.9,pathLength:1,\n      class:'draw',style:`animation-delay:${.1+i*.1}s;animation-duration:.8s`});\n    el(s,'line',{x1:X0,y1:y0,x2:X1,y2:y0,stroke:GRID,'stroke-width':.7,\n      class:'fade',style:`animation-delay:${i*.1}s`});\n    const pk=dens.indexOf(dmax),[px,py]=pts[pk];\n    const dot=el(s,'circle',{cx:px,cy:py,r:2.6,fill:INK,class:'pop',style:`animation-delay:${.6+i*.1}s`});\n    tip(dot,`${name} — most runs finish around ${c.toFixed(1)}h`);\n    txt(s,{x:px+7,y:py+1,'font-size':8,'font-weight':800,fill:INK,\n      style:`paint-order:stroke;stroke:${PAPER};stroke-width:3px;animation-delay:${.7+i*.1}s`,\n      class:'fade'},c.toFixed(1)+'h');\n    txt(s,{x:X0-10,y:y0-3,'font-size':7.5,'font-weight':700,fill:'#6A6963','text-anchor':'end',\n      'letter-spacing':'.06em',class:'fade',style:`animation-delay:${i*.1}s`},name);\n  });\n  const yb=rowY(4);\n  [0,6,12,18,24].forEach(h=>{\n    const x=X0+h/MAXH*(X1-X0);\n    el(s,'line',{x1:x,y1:yb+4,x2:x,y2:yb+9,stroke:'#CFCEC7','stroke-width':.6,\n      class:'fade',style:'animation-delay:.8s'});\n    txt(s,{x,y:yb+20,'font-size':7,'font-weight':600,fill:MUTED,'text-anchor':'middle',\n      class:'fade',style:'animation-delay:.85s'},h+'h');\n  });\n  txt(s,{x:200,y:308,'font-size':7,'font-weight':600,fill:'#B0AFA9','text-anchor':'middle',\n    'letter-spacing':'.12em',class:'fade',style:'animation-delay:1.1s'},\n    'EACH CREST = ONE PIPELINE · THE AREA IS MADE OF HAIRLINES · DOT = THE PEAK');\n});\n})();\n\n// ════ L20 · parallel coordinates ════\n// 多维记录对比的 Lupi 皮：一条发丝线 = 一个产品走过四根轴。\n// 线束的形状就是数据结构（哪两维相关、谁全线领先）。\n// 全线最优的上墨标名，其余发丝退后。轴顶名、轴脚 min/max。\n(()=>{\nconst DIMS=[['PRICE $',8,30],['CSAT',6,9.6],['RETENTION %',55,95],['GROWTH %',-5,40]];\nconst P=[['Editor',12,9.1,91,22],['Boards',18,8.4,86,18],['Forms',9,8.8,78,31],\n  ['Docs',15,8.0,82,12],['Chat',7,7.2,64,8],['Vault',24,7.8,88,6],\n  ['Flows',21,8.6,90,38],['Views',11,7.5,71,14],['Sync',16,6.9,58,-2],\n  ['Pages',8,8.2,74,19],['Grid',19,7.1,62,4],['Hub',13,6.6,52,9]];\nobsReveal('parallel',s=>{\n  const AX=[64,156,248,340],TOP=64,BOT=252;\n  const mapY=(di,v)=>{const [,lo,hi]=DIMS[di];return BOT-(v-lo)/(hi-lo)*(BOT-TOP)};\n  // hero: judged on csat+retention+growth (price is a fact, not a virtue)\n  const score=p=>(p[2]-6)/3.6+(p[3]-55)/40+(p[4]+5)/45;\n  const hero=P.reduce((a,b)=>score(b)>score(a)?b:a);\n  DIMS.forEach(([name,lo,hi],di)=>{\n    el(s,'line',{x1:AX[di],y1:TOP-8,x2:AX[di],y2:BOT+8,stroke:'#B0AFA9','stroke-width':1,\n      class:'fade',style:`animation-delay:${di*.06}s`});\n    [[TOP-8],[BOT+8]].forEach(([yy])=>\n      el(s,'line',{x1:AX[di]-4,y1:yy,x2:AX[di]+4,y2:yy,stroke:'#B0AFA9','stroke-width':1,\n        class:'fade',style:`animation-delay:${di*.06}s`}));\n    txt(s,{x:AX[di],y:TOP-22,'font-size':7,'font-weight':800,fill:'#6A6963','text-anchor':'middle',\n      'letter-spacing':'.08em',class:'fade',style:`animation-delay:${di*.06}s`},name);\n    txt(s,{x:AX[di]+8,y:TOP-5,'font-size':6.5,'font-weight':600,fill:'#C6C5BF',\n      class:'fade',style:`animation-delay:${.1+di*.06}s`},hi);\n    txt(s,{x:AX[di]+8,y:BOT+11,'font-size':6.5,'font-weight':600,fill:'#C6C5BF',\n      class:'fade',style:`animation-delay:${.1+di*.06}s`},lo);\n  });\n  P.forEach((p,i)=>{\n    const isHero=p===hero;\n    const ys=[mapY(0,p[1]),mapY(1,p[2]),mapY(2,p[3]),mapY(3,p[4])];\n    let d=`M${AX[0]} ${ys[0].toFixed(1)}`;\n    for(let k=0;k\u003c3;k++){\n      const mx=(AX[k]+AX[k+1])/2;\n      d+=` C${mx} ${ys[k].toFixed(1)} ${mx} ${ys[k+1].toFixed(1)} ${AX[k+1]} ${ys[k+1].toFixed(1)}`;\n    }\n    const ln=el(s,'path',{d,fill:'none',\n      stroke:isHero?INK:'#8F8E88','stroke-width':isHero?2:.65,\n      opacity:isHero?1:.5+rnd(i+1,5)*.3,pathLength:1,\n      class:'draw',style:`animation-delay:${.2+i*.05}s;animation-duration:.8s`});\n    tip(ln,`${p[0]} — $${p[1]} · CSAT ${p[2]} · ${p[3]}% retained · ${p[4]}% growth`);\n    ys.forEach((y,di)=>el(s,'circle',{cx:AX[di],cy:y,r:isHero?3:1.4,\n      fill:isHero?INK:'#8F8E88',opacity:isHero?1:.7,\n      class:'pop',style:`animation-delay:${.3+i*.05+di*.04}s`}));\n    if(isHero)\n      txt(s,{x:AX[3]+12,y:ys[3]+3,'font-size':9,'font-weight':800,fill:INK,\n        style:`paint-order:stroke;stroke:${PAPER};stroke-width:3px;animation-delay:1s`,\n        class:'fade'},p[0]);\n  });\n  txt(s,{x:200,y:302,'font-size':7,'font-weight':600,fill:'#B0AFA9','text-anchor':'middle',\n    'letter-spacing':'.12em',class:'fade',style:'animation-delay:1.2s'},\n    'ONE HAIRLINE = ONE PRODUCT · INK = BEST ACROSS THE BOARD');\n});\n})();\n})();\n\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"},"basics":{"label":"Basics · 17 张","html":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\" />\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\" />\n\u003ctitle>Lieflat Charts — Basics Gallery · 17 张基础型参考实现\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap\" rel=\"stylesheet\">\n\u003cscript src=\"https://cdn.jsdelivr.net/npm/echarts@6/dist/echarts.min.js\">\u003c/script>\n\u003cstyle>\n  :root{--bg:#F0EFEB;--ink:#1C1C1A;--muted:#8F8E88;--faint:#C6C5BF;--grid:#DEDDD6}\n  *{margin:0;padding:0;box-sizing:border-box}\n  body{background:var(--bg);font-family:'Inter',sans-serif;color:var(--ink);padding:40px;-webkit-font-smoothing:antialiased}\n  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px;max-width:1100px;margin:0 auto}\n  .card{background:var(--bg);border-radius:24px;padding:28px 28px 20px}\n  .card.wide{grid-column:1/-1}\n  h2{font-weight:700;font-size:16.5px;letter-spacing:-.02em;margin-bottom:3px}\n  .sub{font-size:11.5px;color:var(--muted);margin-bottom:14px}\n  .src{font-size:9.5px;color:var(--faint);margin-top:10px;letter-spacing:.08em;font-weight:500}\n  .badge{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.08em;\n    padding:3px 10px;border-radius:99px;margin-bottom:10px;border:1px dashed #B0AFA9;color:#8F8E88}\n  svg{width:100%;max-height:330px;display:block;margin:0 auto}\n  .chartbox{width:100%;height:360px}\n  svg text{font-family:'Inter',sans-serif}\n  .pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,.7,.3,1.3) both}\n  @keyframes pop{from{transform:scale(0)}to{transform:none}}\n  .fade{animation:fade .9s ease both}\n  @keyframes fade{from{opacity:0}}\n  .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s cubic-bezier(.4,0,.2,1) both}\n  @keyframes draw{to{stroke-dashoffset:0}}\n\n  .pagehead{max-width:1100px;margin:0 auto 26px;padding:0 4px}\n  .pagehead h1{font-size:22px;letter-spacing:-.02em;font-weight:800}\n  .pagehead p{font-size:12px;color:#8F8E88;margin-top:5px;line-height:1.7}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"pagehead\">\n  \u003ch1>基础型组（F1–F17）· Lupi 语法 × 基础图型剪影\u003c/h1>\n  \u003cp>柱 / 折线 / 面积 / 环形 / 横条 / 分组 / 堆叠 / 散点 / 瀑布 / 热力 / 进度 / 哑铃 / 矩形树图。远看认得出图型剪影，近看每个单位可数（1 档 = $1k · 1 tick = 1 人 / 1%）。为稀疏聚合数据而设：数据不用多，密度来自单位分解。代码检索方式同 lupi-gallery：按 \u003ccode>// ════ 图型名 ════\u003c/code> 注释块。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"grid2\">\n\n  \u003c!-- B1 · rung bars -->\n  \u003cdiv class=\"card\">\n    \u003cspan class=\"badge\">LUPI 基础型 · 柱状\u003c/span>\n    \u003ch2>Revenue by plan, rung by rung\u003c/h2>\n    \u003cdiv class=\"sub\">one rung = one $k of MRR · the bar is a ladder you can count\u003c/div>\n    \u003csvg id=\"rungs\" viewBox=\"0 0 400 320\" preserveAspectRatio=\"xMidYMid meet\">\u003c/svg>\n    \u003cdiv class=\"src\">RUNG BARS · MONO-BASIC · BILLING\u003c/div>\n  \u003c/div>\n\n  \u003c!-- B2 · hairline line -->\n  \u003cdiv class=\"card\">\n    \u003cspan class=\"badge\">LUPI 基础型 · 折线\u003c/span>\n    \u003ch2>Thirty days of sign-ups\u003c/h2>\n    \u003cdiv class=\"sub\">one dot = one day · hollow = weekend · the barcode floor keeps the calendar honest\u003c/div>\n    \u003csvg id=\"dayline\" viewBox=\"0 0 400 320\" preserveAspectRatio=\"xMidYMid meet\">\u003c/svg>\n    \u003cdiv class=\"src\">HAIRLINE LINE · MONO-BASIC · GROWTH\u003c/div>\n  \u003c/div>\n\n  \u003c!-- B3 · hairline area -->\n  \u003cdiv class=\"card\">\n    \u003cspan class=\"badge\">LUPI 基础型 · 面积\u003c/span>\n    \u003ch2>Concurrent users, filled with days\u003c/h2>\n    \u003cdiv class=\"sub\">one hairline = one day, floor to peak · the area is made of days, not paint\u003c/div>\n    \u003csvg id=\"hairarea\" viewBox=\"0 0 400 320\" preserveAspectRatio=\"xMidYMid meet\">\u003c/svg>\n    \u003cdiv class=\"src\">HAIRLINE AREA · MONO-BASIC · LIVE OPS\u003c/div>\n  \u003c/div>\n\n  \u003c!-- B4 · tick donut -->\n  \u003cdiv class=\"card\">\n    \u003cspan class=\"badge\">LUPI 基础型 · 环形\u003c/span>\n    \u003ch2>Where the traffic comes from\u003c/h2>\n    \u003cdiv class=\"sub\">one tick = one percent · four sources shade the dial · read it like a clock\u003c/div>\n    \u003csvg id=\"tickdonut\" viewBox=\"0 0 400 320\" preserveAspectRatio=\"xMidYMid meet\">\u003c/svg>\n    \u003cdiv class=\"src\">TICK DONUT · MONO-BASIC · ACQUISITION\u003c/div>\n  \u003c/div>\n\n\n\n  \u003c!-- C1 · tick rows (hbar) -->\n  \u003cdiv class=\"card\">\n    \u003cspan class=\"badge\">LUPI 基础型 · 横向条形\u003c/span>\n    \u003ch2>Six teams, shipped and counted\u003c/h2>\n    \u003cdiv class=\"sub\">one tick = one release this quarter · the row is a queue, not a bar\u003c/div>\n    \u003csvg id=\"tickrows\" viewBox=\"0 0 400 320\" preserveAspectRatio=\"xMidYMid meet\">\u003c/svg>\n    \u003cdiv class=\"src\">TICK ROWS · MONO-BASIC · RELEASE LOG\u003c/div>\n  \u003c/div>\n\n  \u003c!-- C2 · paired rungs (grouped bar) -->\n  \u003cdiv class=\"card\">\n    \u003cspan class=\"badge\">LUPI 基础型 · 分组柱\u003c/span>\n    \u003ch2>This year against last, plan by plan\u003c/h2>\n    \u003cdiv class=\"sub\">two ladders per plan · solid rungs = 2026 · faint rungs = 2025 · one rung = $1k\u003c/div>\n    \u003csvg id=\"pairrungs\" viewBox=\"0 0 400 320\" preserveAspectRatio=\"xMidYMid meet\">\u003c/svg>\n    \u003cdiv class=\"src\">PAIRED RUNGS · MONO-BASIC · BILLING YoY\u003c/div>\n  \u003c/div>\n\n  \u003c!-- C3 · stacked rungs -->\n  \u003cdiv class=\"card\">\n    \u003cspan class=\"badge\">LUPI 基础型 · 堆叠柱\u003c/span>\n    \u003ch2>Where each region's revenue sits\u003c/h2>\n    \u003cdiv class=\"sub\">one rung = $1k · three products stack up the ladder, darkest carries the most\u003c/div>\n    \u003csvg id=\"stackrungs\" viewBox=\"0 0 400 320\" preserveAspectRatio=\"xMidYMid meet\">\u003c/svg>\n    \u003cdiv class=\"src\">STACKED RUNGS · MONO-BASIC · REVENUE MIX\u003c/div>\n  \u003c/div>\n\n  \u003c!-- C4 · plumb scatter -->\n  \u003cdiv class=\"card\">\n    \u003cspan class=\"badge\">LUPI 基础型 · 散点\u003c/span>\n    \u003ch2>Price against satisfaction, twelve products\u003c/h2>\n    \u003cdiv class=\"sub\">every dot hangs a plumb line to the floor · read x by the line, y by the height\u003c/div>\n    \u003csvg id=\"plumb\" viewBox=\"0 0 400 320\" preserveAspectRatio=\"xMidYMid meet\">\u003c/svg>\n    \u003cdiv class=\"src\">PLUMB SCATTER · MONO-BASIC · PRODUCT PANEL\u003c/div>\n  \u003c/div>\n\n  \u003c!-- C5 · rung waterfall -->\n  \u003cdiv class=\"card\">\n    \u003cspan class=\"badge\">LUPI 基础型 · 瀑布\u003c/span>\n    \u003ch2>From gross to net, step by step\u003c/h2>\n    \u003cdiv class=\"sub\">one rung = $1k · solid rungs add, hollow rungs take away · the ladder walks down\u003c/div>\n    \u003csvg id=\"fall\" viewBox=\"0 0 400 320\" preserveAspectRatio=\"xMidYMid meet\">\u003c/svg>\n    \u003cdiv class=\"src\">RUNG WATERFALL · MONO-BASIC · P&L\u003c/div>\n  \u003c/div>\n\n  \u003c!-- C6 · dot heat -->\n  \u003cdiv class=\"card\">\n    \u003cspan class=\"badge\">LUPI 基础型 · 热力\u003c/span>\n    \u003ch2>When support gets loud\u003c/h2>\n    \u003cdiv class=\"sub\">7 days × 12 hours · dot area = tickets · biggest cell labeled · silence stays visible\u003c/div>\n    \u003csvg id=\"dotheat\" viewBox=\"0 0 400 320\" preserveAspectRatio=\"xMidYMid meet\">\u003c/svg>\n    \u003cdiv class=\"src\">DOT HEAT · MONO-BASIC · SUPPORT DESK\u003c/div>\n  \u003c/div>\n\n  \u003c!-- C7 · tick gauge -->\n  \u003cdiv class=\"card\">\n    \u003cspan class=\"badge\">LUPI 基础型 · 进度\u003c/span>\n    \u003ch2>How far to the quarter's goal\u003c/h2>\n    \u003cdiv class=\"sub\">one tick = one percent of target · inked = earned · the dial reads left to right\u003c/div>\n    \u003csvg id=\"gauge\" viewBox=\"0 0 400 320\" preserveAspectRatio=\"xMidYMid meet\">\u003c/svg>\n    \u003cdiv class=\"src\">TICK GAUGE · MONO-BASIC · QUARTERLY TARGET\u003c/div>\n  \u003c/div>\n\n  \u003c!-- C8 · dumbbell queue -->\n  \u003cdiv class=\"card\">\n    \u003cspan class=\"badge\">LUPI 基础型 · 哑铃对比\u003c/span>\n    \u003ch2>Onboarding, before and after the redesign\u003c/h2>\n    \u003cdiv class=\"sub\">hollow dot = before · solid dot = after · beads on the track = minutes saved, countable\u003c/div>\n    \u003csvg id=\"dumbbell\" viewBox=\"0 0 400 320\" preserveAspectRatio=\"xMidYMid meet\">\u003c/svg>\n    \u003cdiv class=\"src\">DUMBBELL QUEUE · MONO-BASIC · UX TIMING\u003c/div>\n  \u003c/div>\n\n  \u003c!-- C9 · nested treemap -->\n  \u003cdiv class=\"card wide\">\n    \u003cspan class=\"badge\">LUPI 基础型 · 矩形树图\u003c/span>\n    \u003ch2>Where the work went\u003c/h2>\n    \u003cdiv class=\"sub\">1,280 shipped hours · area = effort · parent bands preserve the product hierarchy\u003c/div>\n    \u003cdiv id=\"treemap\" class=\"chartbox\" role=\"img\" aria-label=\"Treemap of shipped hours nested by product family\">\u003c/div>\n    \u003cdiv class=\"src\">NESTED TREEMAP · MONO-BASIC · WORK PORTFOLIO\u003c/div>\n  \u003c/div>\n\n\n  \u003c!-- F14 · rung histogram -->\n  \u003cdiv class=\"card\">\n    \u003cspan class=\"badge\">LUPI 基础型 · 直方图\u003c/span>\n    \u003ch2>Most tickets resolve within six hours\u003c/h2>\n    \u003cdiv class=\"sub\">one rung = one ticket in a hundred · bins of two hours · the ladder shows the pile\u003c/div>\n    \u003csvg id=\"histo\" viewBox=\"0 0 400 320\" preserveAspectRatio=\"xMidYMid meet\">\u003c/svg>\n    \u003cdiv class=\"src\">RUNG HISTOGRAM · MONO-BASIC · SUPPORT DESK\u003c/div>\n  \u003c/div>\n\n  \u003c!-- F15 · tick box -->\n  \u003cdiv class=\"card\">\n    \u003cspan class=\"badge\">LUPI 基础型 · 箱线图\u003c/span>\n    \u003ch2>Reply times, boxed by plan\u003c/h2>\n    \u003cdiv class=\"sub\">box = the middle half of tickets · paper tick = median · hollow dot = an outlier nobody enjoyed\u003c/div>\n    \u003csvg id=\"boxplot\" viewBox=\"0 0 400 320\" preserveAspectRatio=\"xMidYMid meet\">\u003c/svg>\n    \u003cdiv class=\"src\">TICK BOX · MONO-BASIC · SUPPORT DESK\u003c/div>\n  \u003c/div>\n\n  \u003c!-- F16 · stream ribbon -->\n  \u003cdiv class=\"card wide\">\n    \u003cspan class=\"badge\">LUPI 基础型 · STREAMGRAPH\u003c/span>\n    \u003ch2>Three products trade the same river\u003c/h2>\n    \u003cdiv class=\"sub\">48 weeks of usage share · band width = weekly active accounts · the river swells where the total grows\u003c/div>\n    \u003csvg id=\"stream\" viewBox=\"0 0 840 300\" preserveAspectRatio=\"xMidYMid meet\" style=\"max-height:300px\">\u003c/svg>\n    \u003cdiv class=\"src\">STREAM RIBBON · MONO-BASIC · PRODUCT ANALYTICS\u003c/div>\n  \u003c/div>\n\n  \u003c!-- F17 · candlestick -->\n  \u003cdiv class=\"card\">\n    \u003cspan class=\"badge\">LUPI 基础型 · K 线\u003c/span>\n    \u003ch2>Six weeks of the token, candle by candle\u003c/h2>\n    \u003cdiv class=\"sub\">body = open to close · wick = the day's full reach · ink = closed down · hollow = closed up\u003c/div>\n    \u003csvg id=\"candle\" viewBox=\"0 0 400 320\" preserveAspectRatio=\"xMidYMid meet\">\u003c/svg>\n    \u003cdiv class=\"src\">CANDLESTICK · MONO-BASIC · MARKET DATA\u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\u003cscript>\n// ── shared Mono tokens（与 lupi-gallery 同源） ──\nconst INK='#1C1C1A',PAPER='#F0EFEB',MUTED='#8F8E88',GRID='#DEDDD6';\nconst NS='http://www.w3.org/2000/svg';\nconst el=(p,t,a)=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);p.appendChild(n);return n};\nconst txt=(p,a,s)=>{const n=el(p,'text',a);n.textContent=s;return n};\nconst tip=(n,s)=>{const t=document.createElementNS(NS,'title');t.textContent=s;n.appendChild(t)};\nconst rnd=(i,k)=>Math.abs(((i*73856093)^(k*19349663))%1000)/1000;\nconst D2R=Math.PI/180;\nconst pol=(cx,cy,r,deg)=>[cx+r*Math.cos(deg*D2R),cy+r*Math.sin(deg*D2R)];\nconst obsReveal=(id,fn)=>{\n  const n=document.getElementById(id);\n  const go=()=>{n.innerHTML='';fn(n)};\n  const io=new IntersectionObserver(es=>{if(es[0].isIntersecting){go();io.disconnect()}},{threshold:.3});\n  io.observe(n);\n  n.style.cursor='pointer';\n  n.addEventListener('click',go);\n};\n\n// ════ B1 · rung bars ════\n// 柱状图的 Lupi 化：柱身 = 一格格横档，1 档 = 1 个诚实单位。\n// 远看是柱状图剪影，近看每一档都数得出来。档长、透明度 rnd 抖动。\n(()=>{\nconst D=[['FREE',38],['STARTER',27],['PRO',22],['TEAM',16],['SCALE',11],['ENT',7]];\nobsReveal('rungs',s=>{\n  const x0=i=>56+i*56,base=266,step=5.6,HW=14;\n  D.forEach(([name,v],i)=>{\n    const x=x0(i);\n    for(let k=0;k\u003cv;k++){\n      const y=base-k*step,w=HW-1.5+rnd(k+1,i+2)*3;\n      el(s,'line',{x1:x-w,y1:y,x2:x+w,y2:y,stroke:INK,'stroke-width':1,\n        opacity:.5+rnd(k+2,i+4)*.5,class:'fade',style:`animation-delay:${i*.08+k*.012}s`});\n      if(k%5===4)el(s,'circle',{cx:x+HW+4.5,cy:y,r:.8,fill:'#C6C5BF',\n        class:'fade',style:`animation-delay:${i*.08+k*.012}s`});\n    }\n    const topY=base-(v-1)*step;\n    const num=txt(s,{x,y:topY-10,'font-size':11,'font-weight':800,fill:INK,'text-anchor':'middle',\n      class:'fade',style:`animation-delay:${.4+i*.08}s`},v);\n    tip(num,`${name} — $${v}k MRR`);\n    txt(s,{x,y:base+18,'font-size':7.5,'font-weight':700,fill:MUTED,'text-anchor':'middle',\n      'letter-spacing':'.08em',class:'fade',style:`animation-delay:${i*.08}s`},name);\n  });\n  el(s,'line',{x1:28,y1:base+4,x2:372,y2:base+4,stroke:GRID,'stroke-width':.8,class:'fade'});\n  txt(s,{x:200,y:306,'font-size':7,'font-weight':600,fill:'#B0AFA9','text-anchor':'middle',\n    'letter-spacing':'.12em',class:'fade',style:'animation-delay:.9s'},\n    'ONE RUNG = $1K · DOT MARKS EVERY FIFTH');\n});\n})();\n\n// ════ B2 · hairline line ════\n// 折线图的 Lupi 化：barcode 的日历地板（每天一根发丝，无论有没有事）+\n// 发丝折线 + 逐日圆点（周末空心）。峰值两个点放大标数。\n(()=>{\nconst N=30;\nconst val=d=>46+22*Math.sin(d/4.6)+14*Math.sin(d/2.1)+rnd(d+1,5)*12;\nobsReveal('dayline',s=>{\n  const x=d=>30+d*11.7,base=262,map=v=>base-v*2.15;\n  // calendar floor\n  for(let d=0;d\u003cN;d++)\n    el(s,'line',{x1:x(d),y1:base,x2:x(d),y2:base-7,stroke:'#CFCEC7','stroke-width':.6,\n      class:'fade',style:`animation-delay:${d*.008}s`});\n  el(s,'line',{x1:24,y1:base,x2:376,y2:base,stroke:GRID,'stroke-width':.8,class:'fade'});\n  const vs=Array.from({length:N},(_,d)=>val(d));\n  // top-2 peaks, apart\n  const top=[];\n  for(const d of [...vs.keys()].sort((a,b)=>vs[b]-vs[a])){\n    if(top.every(t=>Math.abs(t-d)>=5))top.push(d);\n    if(top.length===2)break;\n  }\n  // hairline path\n  const pts=vs.map((v,d)=>`${x(d)} ${map(v)}`).join(' L ');\n  el(s,'path',{d:'M'+pts,fill:'none',stroke:INK,'stroke-width':1,pathLength:1,\n    class:'draw',style:'animation-duration:1.2s'});\n  vs.forEach((v,d)=>{\n    const weekend=d%7===5||d%7===6,big=top.includes(d);\n    const dot=el(s,'circle',{cx:x(d),cy:map(v),r:big?4.2:2.1,\n      fill:weekend?PAPER:INK,stroke:INK,'stroke-width':weekend?1:0,\n      class:'pop',style:`animation-delay:${.2+d*.03}s`});\n    tip(dot,`Day ${d+1} — ${Math.round(v)} sign-ups`);\n    if(big)txt(s,{x:x(d),y:map(v)-11,'font-size':9.5,'font-weight':800,fill:INK,'text-anchor':'middle',\n      style:`paint-order:stroke;stroke:${PAPER};stroke-width:3px;animation-delay:${1+d*.01}s`,\n      class:'fade'},Math.round(v));\n  });\n  [[0,'JUN 1'],[14,'JUN 15'],[29,'JUN 30']].forEach(([d,m])=>\n    txt(s,{x:x(d),y:base+18,'font-size':7.5,'font-weight':600,fill:MUTED,'text-anchor':'middle',\n      'letter-spacing':'.1em',class:'fade'},m));\n  txt(s,{x:200,y:306,'font-size':7,'font-weight':600,fill:'#B0AFA9','text-anchor':'middle',\n    'letter-spacing':'.12em',class:'fade',style:'animation-delay:1.1s'},\n    'ONE DOT = ONE DAY · HOLLOW = WEEKEND');\n});\n})();\n\n// ════ B3 · hairline area ════\n// 面积图的 Lupi 化：填充不是色块，是一天一根发丝立到自己的峰值。\n// 面积由日子组成。顶边一根细线收轮廓，峰值日加点标数。\n(()=>{\nconst N=45;\nconst val=d=>34+26*Math.sin(d/7.2)+12*Math.sin(d/2.8)+rnd(d+1,3)*16;\nobsReveal('hairarea',s=>{\n  const x=d=>28+d*7.75,base=262,map=v=>base-v*2.35;\n  el(s,'line',{x1:22,y1:base,x2:378,y2:base,stroke:GRID,'stroke-width':.8,class:'fade'});\n  const vs=Array.from({length:N},(_,d)=>val(d));\n  const peak=vs.indexOf(Math.max(...vs));\n  vs.forEach((v,d)=>{\n    el(s,'line',{x1:x(d),y1:base,x2:x(d),y2:map(v),\n      stroke:d===peak?INK:'#8F8E88','stroke-width':d===peak?1.1:.55,\n      opacity:d===peak?1:.5+rnd(d+1,7)*.45,\n      class:'fade',style:`animation-delay:${d*.014}s`});\n  });\n  const pts=vs.map((v,d)=>`${x(d)} ${map(v)}`).join(' L ');\n  el(s,'path',{d:'M'+pts,fill:'none',stroke:INK,'stroke-width':1.2,pathLength:1,\n    class:'draw',style:'animation-delay:.4s;animation-duration:1.2s'});\n  const pd=el(s,'circle',{cx:x(peak),cy:map(vs[peak]),r:4.2,fill:INK,\n    class:'pop',style:'animation-delay:1.2s'});\n  tip(pd,`Day ${peak+1} — ${Math.round(vs[peak])}k peak`);\n  txt(s,{x:x(peak),y:map(vs[peak])-11,'font-size':9.5,'font-weight':800,fill:INK,'text-anchor':'middle',\n    style:`paint-order:stroke;stroke:${PAPER};stroke-width:3px;animation-delay:1.3s`,\n    class:'fade'},Math.round(vs[peak])+'k');\n  [[0,'MAY'],[22,'JUN'],[44,'JUL']].forEach(([d,m])=>\n    txt(s,{x:x(d),y:base+18,'font-size':7.5,'font-weight':60
