Style:{borderColor:PAPER,borderWidth:3,gapWidth:3}},\n        {upperLabel:{show:false},itemStyle:{borderColor:PAPER,borderWidth:2,gapWidth:2}}]}]});\n};\nconst io=new IntersectionObserver(es=>{if(es[0].isIntersecting){draw();io.disconnect()}},{threshold:.25});\nio.observe(host);\nhost.style.cursor='pointer';\nhost.addEventListener('click',draw);\naddEventListener('resize',()=>chart?.resize());\n})();\n\n// ── New chart-family helpers (scoped to the added templates) ──\n(()=>{\nconst INK='#1C1C1A',PAPER='#F0EFEB',MUTED='#8F8E88',GRID='#DEDDD6';\nconst NS='http://www.w3.org/2000/svg';\nconst el=(p,t,a)=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);p.appendChild(n);return n};\nconst txt=(p,a,s)=>{const n=el(p,'text',a);n.textContent=s;return n};\nconst tip=(n,s)=>{const t=document.createElementNS(NS,'title');t.textContent=s;n.appendChild(t)};\nconst rnd=(i,k)=>Math.abs(((i*73856093)^(k*19349663))%1000)/1000;\n\n// ════ F14 · rung histogram ════\n// 直方图的 Lupi Basics 皮：连续数值分箱，一箱一把梯子，1 档 = 1 张工单\n// （百分之一）。箱界写在梯脚之间——直方图的箱是区间不是类目，\n// 这是它和 F1 Rung Bars 的本质区别。峰值箱标数，中位数落点小旗标注。\n(()=>{\nconst BIN=[6,14,22,19,13,9,6,4,3,2,1,1];       // 2h bins, sums to 100\nobsReveal('histo',s=>{\n  const X0=44,PW=27.5,base=252,step=5.4,HW=10.5;\n  BIN.forEach((v,i)=>{\n    const x=X0+i*PW+PW/2;\n    for(let k=0;k\u003cv;k++){\n      const y=base-k*step,w=HW-1.4+rnd(k+1,i+2)*2.8;\n      el(s,'line',{x1:x-w,y1:y,x2:x+w,y2:y,stroke:INK,'stroke-width':1,\n        opacity:.55+rnd(k+2,i+4)*.45,class:'fade',style:`animation-delay:${i*.06+k*.012}s`});\n      if(k%5===4)el(s,'circle',{cx:x+HW+3.5,cy:y,r:.7,fill:'#C6C5BF',\n        class:'fade',style:`animation-delay:${i*.06+k*.012}s`});\n    }\n  });\n  // peak label\n  const pk=BIN.indexOf(Math.max(...BIN));\n  const px=X0+pk*PW+PW/2;\n  const num=txt(s,{x:px,y:base-(BIN[pk]-1)*step-10,'font-size':11,'font-weight':800,fill:INK,\n    'text-anchor':'middle',class:'fade',style:'animation-delay:.8s'},BIN[pk]);\n  tip(num,`${BIN[pk]} of 100 tickets took ${pk*2}–${pk*2+2}h`);\n  // bin edges: the continuous axis is the histogram's identity\n  el(s,'line',{x1:X0-4,y1:base+4,x2:X0+12*PW+4,y2:base+4,stroke:GRID,'stroke-width':.8,class:'fade'});\n  for(let e=0;e\u003c=12;e++){\n    const x=X0+e*PW;\n    el(s,'line',{x1:x,y1:base+4,x2:x,y2:base+(e%2===0?11:8),stroke:'#CFCEC7','stroke-width':.6,\n      class:'fade',style:`animation-delay:${e*.02}s`});\n    if(e%2===0)txt(s,{x,y:base+21,'font-size':7,'font-weight':600,fill:MUTED,'text-anchor':'middle',\n      class:'fade',style:`animation-delay:${e*.02}s`},e*2+'h');\n  }\n  // median flag: cumulative crosses 50 inside bin 2\n  let acc=0,mb=0;for(let i=0;i\u003c12;i++){acc+=BIN[i];if(acc>=50){mb=i;break}}\n  const mx=X0+mb*PW+PW*.7;\n  el(s,'line',{x1:mx,y1:base+4,x2:mx,y2:base-BIN[mb]*step-16,stroke:'#8F8E88','stroke-width':.9,\n    'stroke-dasharray':'2 4',class:'fade',style:'animation-delay:1s'});\n  txt(s,{x:mx+4,y:base-BIN[mb]*step-20,'font-size':7.5,'font-weight':800,fill:'#6A6963',\n    class:'fade',style:'animation-delay:1.1s'},'HALF RESOLVED BY HERE');\n  txt(s,{x:200,y:306,'font-size':7,'font-weight':600,fill:'#B0AFA9','text-anchor':'middle',\n    'letter-spacing':'.12em',class:'fade',style:'animation-delay:1.2s'},\n    'ONE RUNG = ONE TICKET IN A HUNDRED · BINS OF TWO HOURS · DOT MARKS EVERY FIFTH');\n});\n})();\n\n// ════ F15 · tick box ════\n// 箱线图的 Basics 皮：发丝须线 + 胶囊箱体（IQR），纸色横档 = 中位数，\n// 空心点 = 离群值。箱体明度按中位数快慢排：越快越黑。\n(()=>{\nconst G=[['ENT',[.4,.9,1.5,2.6,4.4],[6.2]],\n         ['PRO',[.8,2.1,3.3,5,7.8],[10.5]],\n         ['STARTER',[1.5,3.8,6.1,8.9,13.2],[16.8]],\n         ['FREE',[2.2,6,9.4,13.8,19.6],[22.1,23.5]]];\nconst SHADE=[INK,'#4A4944','#8F8E88','#B0AFA9'];\nobsReveal('boxplot',s=>{\n  const TOP=42,BASE=260,MAXH=24,mapY=v=>BASE-v/MAXH*(BASE-TOP);\n  const colX=g=>78+g*84,BW=24;\n  [0,6,12,18,24].forEach(h=>{\n    el(s,'line',{x1:36,y1:mapY(h),x2:378,y2:mapY(h),stroke:'#E3E2DB','stroke-width':.8,\n      class:'fade',style:`animation-delay:${h*.008}s`});\n    txt(s,{x:30,y:mapY(h)+3,'font-size':7.5,'font-weight':600,fill:MUTED,'text-anchor':'end',\n      class:'fade',style:`animation-delay:${h*.008}s`},h+'h');\n  });\n  G.forEach(([name,[mn,q1,md,q3,mx],outs],g)=>{\n    const x=colX(g);\n    el(s,'line',{x1:x,y1:mapY(mn),x2:x,y2:mapY(mx),stroke:'#8F8E88','stroke-width':.8,\n      pathLength:1,class:'draw',style:`animation-delay:${g*.12}s;animation-duration:.6s`});\n    [mn,mx].forEach(vv=>el(s,'line',{x1:x-7,y1:mapY(vv),x2:x+7,y2:mapY(vv),\n      stroke:'#8F8E88','stroke-width':1,class:'fade',style:`animation-delay:${.2+g*.12}s`}));\n    const box=el(s,'rect',{x:x-BW/2,y:mapY(q3),width:BW,height:mapY(q1)-mapY(q3),rx:9,\n      fill:SHADE[g],class:'pop',style:`animation-delay:${.15+g*.12}s`});\n    tip(box,`${name} — half of tickets answered in ${q1}–${q3}h`);\n    el(s,'line',{x1:x-BW/2+3,y1:mapY(md),x2:x+BW/2-3,y2:mapY(md),stroke:PAPER,'stroke-width':2.2,\n      class:'fade',style:`animation-delay:${.5+g*.12}s`});\n    txt(s,{x:x+BW/2+6,y:mapY(md)+3,'font-size':9.5,'font-weight':800,fill:INK,\n      class:'fade',style:`animation-delay:${.6+g*.12}s`},md.toFixed(1)+'h');\n    outs.forEach((o,k)=>{\n      const d=el(s,'circle',{cx:x+(rnd(k+1,g+3)-.5)*8,cy:mapY(o),r:2.6,fill:PAPER,\n        stroke:'#6A6963','stroke-width':1.1,class:'pop',style:`animation-delay:${.7+g*.12+k*.06}s`});\n      tip(d,`${name} outlier — ${o}h`);\n    });\n    txt(s,{x,y:BASE+18,'font-size':7.5,'font-weight':700,fill:MUTED,'text-anchor':'middle',\n      'letter-spacing':'.08em',class:'fade',style:`animation-delay:${g*.12}s`},name);\n  });\n  txt(s,{x:200,y:306,'font-size':7,'font-weight':600,fill:'#B0AFA9','text-anchor':'middle',\n    'letter-spacing':'.12em',class:'fade',style:'animation-delay:1.2s'},\n    'BOX = MIDDLE HALF · PAPER TICK = MEDIAN · HOLLOW = OUTLIER · DARKEST = FASTEST');\n});\n})();\n\n// ════ F16 · stream ribbon ════\n// Streamgraph / ThemeRiver：多系列构成随时间此消彼长。轮廓对称于中轴\n// （silhouette 基线），带宽 = 该系列当周量，纸色缝分带（treemap 同法）。\n// 三带明度按当前份额排：现任霸主最黑。带名标在各自最宽处。\n(()=>{\nconst N=48;\nconst mk=(base,trend,w1,w2,seed)=>Array.from({length:N},(_,t)=>\n  Math.max(2,base+trend*t+10*Math.sin(t/w1+seed)+5*Math.sin(t/w2+seed*2)+rnd(t+1,seed)*6));\nconst SERIES=[\n  ['LEGACY EDITOR',mk(46,-.62,9,3.7,2),'#C6C5BF'],\n  ['BOARDS',mk(26,.10,11,4.2,5),'#8F8E88'],\n  ['FLOWS',mk(12,.78,10,3.1,8),INK],\n];\nobsReveal('stream',s=>{\n  const X0=36,X1=744,CY=138,SC=1.15;\n  const x=t=>X0+t/(N-1)*(X1-X0);\n  const tot=Array.from({length:N},(_,t)=>SERIES.reduce((a,S)=>a+S[1][t],0));\n  // stacked offsets, silhouette baseline: top of stack starts at -total/2\n  const y0=Array.from({length:N},(_,t)=>CY-tot[t]*SC/2);\n  const smooth=pts=>{\n    let d=`M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;\n    for(let k=1;k\u003cpts.length-1;k++){\n      const p=pts[k],q=pts[k+1];\n      d+=` Q${p[0].toFixed(1)} ${p[1].toFixed(1)} ${((p[0]+q[0])/2).toFixed(1)} ${((p[1]+q[1])/2).toFixed(1)}`;\n    }\n    return d+` L${pts[pts.length-1][0].toFixed(1)} ${pts[pts.length-1][1].toFixed(1)}`;\n  };\n  let run=y0.slice();\n  SERIES.forEach(([name,vals,shade],si)=>{\n    const top=run.map((v,t)=>[x(t),v]);\n    const bot=run.map((v,t)=>[x(t),v+vals[t]*SC]);\n    run=bot.map(p=>p[1]);\n    const d=smooth(top)+' L '+[...bot].reverse().map(p=>`${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' L ')+' Z';\n    const band=el(s,'path',{d,fill:shade,stroke:PAPER,'stroke-width':2,\n      class:'fade',style:`animation-delay:${si*.16}s`});\n    tip(band,`${name} — weekly active accounts, 48 weeks`);\n    // label at the band's widest week — clamped off both ends so the\n    // paper-colored text never spills past the band onto paper (invisible)\n    let wk=4;vals.forEach((v,t)=>{if(t>=4&&t\u003c=N-6&&v>vals[wk])wk=t});\n    const midY=(top[wk][1]+bot[wk][1])/2;\n    const dark=shade===INK||shade==='#4A4944';\n    txt(s,{x:x(wk),y:midY+3,'font-size':9,'font-weight':800,'text-anchor':'middle',\n      fill:dark?PAPER:'#4A4944','letter-spacing':'.06em',\n      class:'fade',style:`animation-delay:${.5+si*.14}s`},name);\n  });\n  // month floor: barcode ticks + labels every 8 weeks\n  const base=252;\n  el(s,'line',{x1:X0-6,y1:base,x2:X1+6,y2:base,stroke:GRID,'stroke-width':.8,class:'fade'});\n  for(let t=0;t\u003cN;t++)\n    el(s,'line',{x1:x(t),y1:base,x2:x(t),y2:base-(t%8===0?7:4),stroke:'#CFCEC7','stroke-width':.6,\n      class:'fade',style:`animation-delay:${t*.006}s`});\n  ['JAN','MAR','MAY','JUL','SEP','NOV'].forEach((m,k)=>\n    txt(s,{x:x(k*8),y:base+15,'font-size':7.5,'font-weight':600,fill:MUTED,'text-anchor':'middle',\n      'letter-spacing':'.1em',class:'fade'},m));\n  txt(s,{x:390,y:288,'font-size':7,'font-weight':600,fill:'#B0AFA9','text-anchor':'middle',\n    'letter-spacing':'.12em',class:'fade',style:'animation-delay:1.1s'},\n    'BAND WIDTH = WEEKLY ACTIVES · DARKEST = TODAY’S LEADER · THE RIVER IS THE TOTAL');\n});\n})();\n\n// ════ F17 · candlestick ════\n// K 线的 Mono 化：不用红绿——实心墨 = 收跌，空心（纸底墨框）= 收涨，\n// 和哑铃图 hollow/ink 的语义一脉。影线是发丝，柱体胶囊圆角。\n// OHLC 四值都是真实记录，最高/最低两日标数。30 个交易日。\n(()=>{\nconst N=30;\n// deterministic random walk with a dip-and-recover arc\nconst DAYS=[];\nlet px=52;\nfor(let d=0;d\u003cN;d++){\n  const drift=d\u003c10?.4:d\u003c18?-1.5:1.3;\n  const open=px;\n  const close=Math.max(30,open+drift+(rnd(d+1,3)-.5)*4.6);\n  const hi=Math.max(open,close)+rnd(d+2,7)*2.6;\n  const lo=Math.min(open,close)-rnd(d+3,11)*2.6;\n  DAYS.push([open,close,hi,lo]);\n  px=close;\n}\nobsReveal('candle',s=>{\n  const X0=40,PW=11.2,BASE=258,TOP=44;\n  const vmin=Math.min(...DAYS.map(d=>d[3])),vmax=Math.max(...DAYS.map(d=>d[2]));\n  const mapY=v=>BASE-(v-vmin)/(vmax-vmin)*(BASE-TOP);\n  const x=d=>X0+d*PW+PW/2;\n  // price grid\n  for(let g=0;g\u003c=4;g++){\n    const v=vmin+g/4*(vmax-vmin);\n    el(s,'line',{x1:X0-4,y1:mapY(v),x2:X0+N*PW+4,y2:mapY(v),stroke:'#E3E2DB','stroke-width':.8,\n      class:'fade',style:`animation-delay:${g*.03}s`});\n    txt(s,{x:X0-8,y:mapY(v)+3,'font-size':7.5,'font-weight':600,fill:MUTED,'text-anchor':'end',\n      class:'fade',style:`animation-delay:${g*.03}s`},'$'+Math.round(v));\n  }\n  let hiD=0,loD=0;\n  DAYS.forEach(([o,c,h,l],d)=>{\n    if(h>DAYS[hiD][2])hiD=d;\n    if(l\u003cDAYS[loD][3])loD=d;\n  });\n  DAYS.forEach(([o,c,h,l],d)=>{\n    const cx=x(d),up=c>=o;\n    const yT=mapY(Math.max(o,c)),yB=mapY(Math.min(o,c));\n    // wick: one hairline, full reach\n    el(s,'line',{x1:cx,y1:mapY(h),x2:cx,y2:mapY(l),stroke:'#6A6963','stroke-width':.7,\n      class:'fade',style:`animation-delay:${d*.03}s`});\n    // body: capsule; hollow = up, ink = down\n    const body=el(s,'rect',{x:cx-3.4,y:yT,width:6.8,height:Math.max(2.5,yB-yT),rx:3,\n      ...(up?{fill:PAPER,stroke:INK,'stroke-width':1.1}:{fill:INK}),\n      class:'fade',style:`animation-delay:${.05+d*.03}s`});\n    tip(body,`Day ${d+1} — open $${o.toFixed(1)} · close $${c.toFixed(1)} · high $${h.toFixed(1)} · low $${l.toFixed(1)}`);\n    // extremes, labeled with hairline flags\n    if(d===hiD)txt(s,{x:cx,y:mapY(h)-7,'font-size':8,'font-weight':800,fill:INK,'text-anchor':'middle',\n      style:`paint-order:stroke;stroke:${PAPER};stroke-width:3px;animation-delay:1s`,\n      class:'fade'},'$'+Math.round(h));\n    if(d===loD)txt(s,{x:cx,y:mapY(l)+14,'font-size':8,'font-weight':800,fill:'#6A6963','text-anchor':'middle',\n      style:`paint-order:stroke;stroke:${PAPER};stroke-width:3px;animation-delay:1s`,\n      class:'fade'},'$'+Math.round(l));\n  });\n  // week ticks on the floor\n  el(s,'line',{x1:X0-4,y1:BASE+8,x2:X0+N*PW+4,y2:BASE+8,stroke:GRID,'stroke-width':.8,class:'fade'});\n  for(let d=0;d\u003cN;d++)\n    el(s,'line',{x1:x(d),y1:BASE+8,x2:x(d),y2:BASE+8-(d%5===0?6:3),stroke:'#CFCEC7','stroke-width':.6,\n      class:'fade',style:`animation-delay:${d*.008}s`});\n  ['W1','W2','W3','W4','W5','W6'].forEach((w,k)=>\n    txt(s,{x:x(k*5),y:BASE+21,'font-size':7,'font-weight':600,fill:MUTED,'text-anchor':'middle',\n      'letter-spacing':'.08em',class:'fade'},w));\n  txt(s,{x:200,y:306,'font-size':7,'font-weight':600,fill:'#B0AFA9','text-anchor':'middle',\n    'letter-spacing':'.12em',class:'fade',style:'animation-delay:1.1s'},\n    'INK BODY = CLOSED DOWN · HOLLOW = CLOSED UP · WICK = THE DAY’S FULL REACH');\n});\n})();\n})();\n\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"},"glance":{"label":"Glance · 22 张","html":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\" />\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\" />\n\u003ctitle>Lieflat Charts — Glance Gallery · 22 张参考实现\u003c/title>\n\u003cscript src=\"https://cdn.jsdelivr.net/npm/chart.js@4\">\u003c/script>\n\u003cscript src=\"https://cdn.jsdelivr.net/npm/echarts@6/dist/echarts.min.js\">\u003c/script>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n  :root{--bg:#F0EFEB;--dark:#1C1C1A;--ink:#1C1C1A;--muted:#8F8E88;--faint:#C6C5BF;--grid:#DEDDD6}\n  *{margin:0;padding:0;box-sizing:border-box}\n  body{background:var(--bg);font-family:'Inter',sans-serif;color:var(--ink);padding:40px;-webkit-font-smoothing:antialiased}\n  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px;max-width:1400px;margin:0 auto}\n  .card{background:var(--bg);border-radius:24px;padding:28px 28px 20px}\n  .card.dark{background:var(--dark);color:#F0EFEB}\n  .card.dark .sub{color:#8F8E88}\n  .card.dark .src{color:#55554F}\n  h2{font-weight:700;font-size:16.5px;letter-spacing:-.02em;margin-bottom:3px}\n  .sub{font-size:11.5px;color:var(--muted);margin-bottom:14px}\n  .src{font-size:9.5px;color:var(--faint);margin-top:10px;letter-spacing:.08em;font-weight:500}\n  .ch{height:320px}\n  .wrap{position:relative;height:320px}\n  svg text{font-family:'Inter',sans-serif}\n  .pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,.7,.3,1.3) both}\n  @keyframes pop{from{transform:scale(0)}to{transform:none}}\n\n  .pagehead{max-width:1400px;margin:0 auto 26px;padding:0 4px}\n  .pagehead h1{font-size:22px;letter-spacing:-.02em;font-weight:800}\n  .pagehead p{font-size:12px;color:#8F8E88;margin-top:5px;line-height:1.7}\n  .pagehead .badge{margin:0 2px}\n  .badge{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.08em;\n    padding:3px 10px;border-radius:99px;margin-bottom:10px}\n  .badge.del{background:#1C1C1A;color:#F0EFEB}\n  .badge.pick{border:1.5px solid #1C1C1A;color:#1C1C1A}\n  .badge.pair{border:1px dashed #B0AFA9;color:#8F8E88}\n  .card.dark .badge.del{background:#F0EFEB;color:#1C1C1A}\n  .card.dark .badge.pick{border-color:#F0EFEB;color:#F0EFEB}\n  .card.dark .badge.pair{border-color:#55554F;color:#8F8E88}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"pagehead\">\n\n  \u003ch1>Glance 系（快读）· 22 张参考实现\u003c/h1>\n  \u003cp>粗笔画 · 提前聚合 · 3 秒读完。每张卡是一个图型的参考实现；代码在页内 \u003ccode>// ════ 图型名 ════\u003c/code> 注释块里，按 catalog.md 的卡内标题检索。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"grid2\">\n\n  \u003c!-- ══ mono-demo ══ -->\n  \u003cdiv class=\"card\">\n    \u003ch2>Daily active range\u003c/h2>\n    \u003cdiv class=\"sub\">min – max concurrent users · 1–14 Feb\u003c/div>\n    \u003cdiv class=\"wrap\">\u003ccanvas id=\"c1\">\u003c/canvas>\u003c/div>\n    \u003cdiv class=\"src\">RANGE CAPSULES · MONO-DEMO · LIVE OPS\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"card dark\">\n    \u003ch2>How releases made us feel\u003c/h2>\n    \u003cdiv class=\"sub\">reactions tagged in retro · H1 2026\u003c/div>\n    \u003cdiv class=\"ch\" id=\"rose\">\u003c/div>\n    \u003cdiv class=\"src\">PETAL ROSE · MONO-DEMO · TEAM RETRO BOARD\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"card\">\n    \u003ch2>Revenue by plan\u003c/h2>\n    \u003cdiv class=\"sub\">Q2 2026 · MRR, $K\u003c/div>\n    \u003cdiv class=\"wrap\">\u003ccanvas id=\"c3\">\u003c/canvas>\u003c/div>\n    \u003cdiv class=\"src\">CHUNKY BARS · MONO-DEMO · BILLING\u003c/div>\n  \u003c/div>\n\n  \u003c!-- ══ mono-redesign · dot waffle ══ -->\n  \u003cdiv class=\"card\">\n    \u003ch2>Where sign-ups come from\u003c/h2>\n    \u003cdiv class=\"sub\">Q2 2026 · every dot = 1% of new accounts\u003c/div>\n    \u003csvg id=\"waffle\" viewBox=\"0 0 380 300\" width=\"100%\" style=\"max-height:320px\">\u003c/svg>\n    \u003cdiv class=\"src\">DONUT, REDESIGNED · MONO-REDESIGN · ATTRIBUTION\u003c/div>\n  \u003c/div>\n\n  \u003c!-- ══ mono-fancy ══ -->\n  \u003cdiv class=\"card\">\n    \u003ch2>Trees planted, year by year\u003c/h2>\n    \u003cdiv class=\"sub\">reforestation program · thousands of trees\u003c/div>\n    \u003cdiv class=\"ch\" id=\"forest\">\u003c/div>\n    \u003cdiv class=\"src\">PICTORIAL BAR · MONO-FANCY · GREEN OPS\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"card dark\">\n    \u003ch2>Who works with whom\u003c/h2>\n    \u003cdiv class=\"sub\">cross-team collaborations · Q2 2026 · line = shared project\u003c/div>\n    \u003cdiv class=\"ch\" id=\"circular\">\u003c/div>\n    \u003cdiv class=\"src\">CIRCULAR GRAPH · MONO-FANCY · PROJECT DB\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"card\">\n    \u003ch2>Everything the platform ships\u003c/h2>\n    \u003cdiv class=\"sub\">product areas and capabilities · Jun 2026\u003c/div>\n    \u003cdiv class=\"ch\" id=\"tree\">\u003c/div>\n    \u003cdiv class=\"src\">TREE · MONO-FANCY · PRODUCT CATALOG\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"card\">\n    \u003ch2>Campaigns rain down, sign-ups flow\u003c/h2>\n    \u003cdiv class=\"sub\">daily ad spend (from top, $K) vs sign-ups (flow, hundreds) · 30 days\u003c/div>\n    \u003cdiv class=\"ch\" id=\"rainfall\">\u003c/div>\n    \u003cdiv class=\"src\">DUAL AREA · MONO-FANCY · GROWTH + ADS\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"card\">\n    \u003ch2>One dataset, three views\u003c/h2>\n    \u003cdiv class=\"sub\">watch the same 12 products fly between views · every 3s\u003c/div>\n    \u003cdiv class=\"ch\" id=\"morph\">\u003c/div>\n    \u003cdiv class=\"src\">SCATTER MORPH · MONO-FANCY · COHORTS\u003c/div>\n  \u003c/div>\n\n  \u003c!-- ══ mono-fancy2 ══ -->\n  \u003cdiv class=\"card\">\n    \u003ch2>Where we gained, where we bled\u003c/h2>\n    \u003cdiv class=\"sub\">net accounts per segment · Q2 2026 · churn left, growth right\u003c/div>\n    \u003cdiv class=\"ch\" id=\"negbar\">\u003c/div>\n    \u003cdiv class=\"src\">DIVERGING BAR · MONO-FANCY2 · CRM\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"card dark\">\n    \u003ch2>Integrations, pulled into orbit\u003c/h2>\n    \u003cdiv class=\"sub\">force layout · node = monthly syncs · drag a node, the web fights back\u003c/div>\n    \u003cdiv class=\"ch\" id=\"force\">\u003c/div>\n    \u003cdiv class=\"src\">FORCE GRAPH · NEW · INTEGRATION HUB\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"card\">\n    \u003ch2>Fifty markets, one wave\u003c/h2>\n    \u003cdiv class=\"sub\">sign-ups per market · bars cascade in · click to replay\u003c/div>\n    \u003cdiv class=\"ch\" id=\"wave\">\u003c/div>\n    \u003cdiv class=\"src\">STAGGER DELAY · MONO-FANCY2 · GROWTH\u003c/div>\n  \u003c/div>\n\n  \u003c!-- ══ mono-fancy3 ══ -->\n  \u003cdiv class=\"card\">\n    \u003ch2>Big slice, deep engagement\u003c/h2>\n    \u003cdiv class=\"sub\">angle = share of users · radius = minutes per day · dotted rings at 15 / 30 / 45 min\u003c/div>\n    \u003cdiv class=\"ch\" id=\"custompie\">\u003c/div>\n    \u003cdiv class=\"src\">CUSTOM PIE · MONO-FANCY3 · PRODUCT ANALYTICS\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"card\">\n    \u003ch2>Support load, day by day\u003c/h2>\n    \u003cdiv class=\"sub\">tickets per hour · each row is its own axis · dot = volume\u003c/div>\n    \u003cdiv class=\"ch\" id=\"singleaxis\">\u003c/div>\n    \u003cdiv class=\"src\">SINGLE AXIS · MONO-FANCY3 · SUPPORT DESK\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"card\">\n    \u003ch2>Response times, spread out\u003c/h2>\n    \u003cdiv class=\"sub\">every dot = one ticket · jitter reveals the pile-up · by priority\u003c/div>\n    \u003cdiv class=\"ch\" id=\"jitter\">\u003c/div>\n    \u003cdiv class=\"src\">JITTER STRIP · MONO-FANCY3 · SUPPORT DESK\u003c/div>\n  \u003c/div>\n\n  \u003c!-- ══ mono-fancy4 ══ -->\n  \u003cdiv class=\"card\">\n    \u003ch2>Eight products race for revenue\u003c/h2>\n    \u003cdiv class=\"sub\">MRR by product, $K · 2019 → 2026 · leader wears black · click to replay\u003c/div>\n    \u003cdiv class=\"ch\" id=\"race\">\u003c/div>\n    \u003cdiv class=\"src\">BAR RACE · MONO-FANCY4 · BILLING\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"card\">\n    \u003ch2>Concurrent users, streaming\u003c/h2>\n    \u003cdiv class=\"sub\">one new reading every 300ms · window of 50 · click to restart\u003c/div>\n    \u003cdiv class=\"ch\" id=\"stream\">\u003c/div>\n    \u003cdiv class=\"src\">DYNAMIC DATA · MONO-FANCY4 · LIVE OPS\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"card\">\n    \u003ch2>H1 revenue, drawn in one stroke\u003c/h2>\n    \u003cdiv class=\"sub\">cumulative ARR · the line draws, the number counts · click to replay\u003c/div>\n    \u003cdiv class=\"ch\" id=\"stroke\">\u003c/div>\n    \u003cdiv class=\"src\">DRAW-IN + COUNTER · MONO-FANCY4 · FINANCE\u003c/div>\n  \u003c/div>\n\n\n  \u003c!-- G19 · violin -->\n  \u003cdiv class=\"card\">\n    \u003cspan class=\"badge\">GLANCE 分布型 · 小提琴\u003c/span>\n    \u003ch2>How fast each plan gets an answer\u003c/h2>\n    \u003cdiv class=\"sub\">hours to first reply · silhouette = where tickets pile up · paper tick = median\u003c/div>\n    \u003csvg id=\"violin\" viewBox=\"0 0 400 320\" preserveAspectRatio=\"xMidYMid meet\">\u003c/svg>\n    \u003cdiv class=\"src\">VIOLIN · MONO-GLANCE · SUPPORT DESK\u003c/div>\n  \u003c/div>\n\n  \u003c!-- G20 · matrix heat -->\n  \u003cdiv class=\"card\">\n    \u003cspan class=\"badge\">GLANCE 热力型 · 通用矩阵\u003c/span>\n    \u003ch2>Adoption runs hot on the new versions\u003c/h2>\n    \u003cdiv class=\"sub\">5 versions × 6 features · shade = % of accounts using it · every cell carries its number\u003c/div>\n    \u003csvg id=\"gheat\" viewBox=\"0 0 400 320\" preserveAspectRatio=\"xMidYMid meet\">\u003c/svg>\n    \u003cdiv class=\"src\">MATRIX HEAT (GLANCE) · MONO-GLANCE · PRODUCT ANALYTICS\u003c/div>\n  \u003c/div>\n\n  \u003c!-- G21 · rank strip -->\n  \u003cdiv class=\"card\">\n    \u003cspan class=\"badge\">GLANCE 排名型 · RANK STRIP\u003c/span>\n    \u003ch2>Flows climbs to the top\u003c/h2>\n    \u003cdiv class=\"sub\">one row per product, one cell per quarter · darker = higher rank · a bar race you can print\u003c/div>\n    \u003csvg id=\"rankstrip\" viewBox=\"0 0 400 320\" preserveAspectRatio=\"xMidYMid meet\">\u003c/svg>\n    \u003cdiv class=\"src\">RANK STRIP · MONO-GLANCE · BILLING\u003c/div>\n  \u003c/div>\n\n  \u003c!-- G22 · aggregate sankey -->\n  \u003cdiv class=\"card\">\n    \u003cspan class=\"badge\">GLANCE 流向型 · 聚合桑基\u003c/span>\n    \u003ch2>Channels pour into plans\u003c/h2>\n    \u003cdiv class=\"sub\">ribbon width = accounts · channels on the left, the plans they land in on the right\u003c/div>\n    \u003csvg id=\"sankey\" viewBox=\"0 0 400 320\" preserveAspectRatio=\"xMidYMid meet\">\u003c/svg>\n    \u003cdiv class=\"src\">AGGREGATE SANKEY · MONO-GLANCE · ATTRIBUTION\u003c/div>\n  \u003c/div>\n\n\u003c/div>\n\u003cscript>\n// ── shared Mono tokens ──\nconst INK='#1C1C1A',PAPER='#F0EFEB',MUTED='#8F8E88',GRID='#DEDDD6';\nconst L=['#1C1C1A','#4A4944','#6A6963','#8F8E88','#B0AFA9','#C6C5BF'];\nconst LAD=['#1C1C1A','#4A4944','#8F8E88','#B0AFA9','#D8D7D1'];\nconst tipLight={backgroundColor:INK,borderWidth:0,textStyle:{color:PAPER,fontFamily:'Inter',fontSize:12},padding:[10,14]};\nconst tipDark={backgroundColor:PAPER,borderWidth:0,textStyle:{color:INK,fontFamily:'Inter',fontSize:12},padding:[10,14]};\nconst rnd=(i,k)=>((i*73856093)^(k*19349663))%1000/1000; // deterministic\n\n// ── unified reveal: every chart waits to be scrolled into view; click replays.\n//    fn charts manage their own timers via keep(); they're cleared on replay.\nconst timers={};\nconst obsReveal=(id,fn)=>{\n  const el=document.getElementById(id);\n  const go=()=>{(timers[id]||[]).forEach(clearInterval);timers[id]=[];fn(el)};\n  const io=new IntersectionObserver(es=>{\n    if(es[0].isIntersecting){go();io.disconnect()}\n  },{threshold:.35});\n  io.observe(el);\n  el.style.cursor='pointer';\n  el.addEventListener('click',go);\n};\nconst keep=(id,t)=>{(timers[id]=timers[id]||[]).push(t)};\nconst eReveal=(id,opt)=>obsReveal(id,el=>{\n  const g=echarts.getInstanceByDom(el)||echarts.init(el);\n  g.clear();g.setOption(opt);\n});\nconst cjs={};\nconst cReveal=(id,mkCfg)=>obsReveal(id,el=>{\n  cjs[id]?.destroy();\n  cjs[id]=new Chart(el,mkCfg());\n});\n\nChart.defaults.color=MUTED;\nChart.defaults.font.family='Inter';\nChart.defaults.font.size=10.5;\nChart.defaults.borderColor=GRID;\nChart.defaults.plugins.legend.display=false;\nChart.defaults.plugins.tooltip.backgroundColor=INK;\nChart.defaults.plugins.tooltip.titleColor='#F0EFEB';\nChart.defaults.plugins.tooltip.bodyColor='#A5A49E';\nChart.defaults.plugins.tooltip.padding=12;\nChart.defaults.plugins.tooltip.cornerRadius=12;\nChart.defaults.plugins.tooltip.displayColors=false;\n\n// ════ mono-demo · 1: floating range capsules ════\n(()=>{\nconst ranges=[[195,235],[165,192],[150,232],[73,168],[122,202],[182,192],[138,178],[162,227],[195,235],[228,305],[218,232],[165,232],[118,210],[195,232]];\ncReveal('c1',()=>({\n  type:'bar',\n  data:{labels:ranges.map((_,i)=>i+1),\n    datasets:[{data:ranges,backgroundColor:INK,borderRadius:99,borderSkipped:false,barPercentage:.32}]},\n  options:{\n    maintainAspectRatio:false,\n    animation:{duration:800,easing:'easeOutQuart',delay:c=>c.type==='data'?c.dataIndex*40:0},\n    plugins:{tooltip:{callbacks:{label:i=>i.raw[0]+'K – '+i.raw[1]+'K users'}}},\n    scales:{\n      x:{grid:{display:false},border:{display:false},\n         ticks:{padding:6,font:{size:9},callback:v=>[0,6,13].includes(v)?(v+1)+' FEB':''}},\n      y:{min:50,max:320,grid:{display:false},border:{display:false},\n         ticks:{padding:8,maxTicksLimit:6,callback:v=>v+'K',font:{size:9.5}}},\n    },\n  },\n}));\n})();\n\n// ════ mono-demo · 2: petal rose on dark ════\n(()=>{\nconst EMO=[\n  ['Happiness',12],['Awe',10],['Admiration',5],['Surprise',12],\n  ['Sadness',6],['Fear',4],['Anger',2],['Anticipation',5],\n];\nconst MAXV=12;\nconst petal=v=>{const t=v/MAXV;return t>.8?'#F2F1ED':t>.6?'#E4E3DD':t>.35?'#C9C8C1':'#A8A7A0'};\neReveal('rose',{\n  animationDuration:1100,animationEasing:'quarticOut',\n  tooltip:{...tipDark,formatter:p=>p.name+' — '+EMO[p.dataIndex][1]},\n  series:[\n    {type:'pie',silent:false,radius:['14%','92%'],center:['50%','50%'],\n     itemStyle:{color:'#32312D',borderRadius:16,borderColor:'#1C1C1A',borderWidth:5},\n     label:{show:false},emphasis:{scale:false},\n     data:EMO.map(([n])=>({name:n,value:1})),z:1},\n    {type:'pie',silent:true,radius:['14%','92%'],center:['50%','50%'],\n     itemStyle:{color:'transparent'},label:{position:'inside'},\n     data:EMO.map(([n,v])=>({name:n,value:1,\n       label:{formatter:`{n|${v}}\\n{l|${n}}`,rich:{\n         n:{fontSize:17,fontWeight:700,fontFamily:'Inter',lineHeight:20,color:v>=8?'#1C1C1A':'#C8C7C1'},\n         l:{fontSize:9.5,fontFamily:'Inter',color:v>=8?'#55554F':'#8F8E88'},\n       }}})),z:3},\n    {type:'pie',roseType:'area',silent:true,radius:['14%','88%'],center:['50%','50%'],\n     itemStyle:{borderRadius:14,borderColor:'#1C1C1A',borderWidth:5},label:{show:false},\n     data:EMO.map(([n,v])=>({name:n,value:v,itemStyle:{color:petal(v)}})),z:2},\n  ],\n});\n})();\n\n// ════ mono-demo · 3: chunky bars, values on top ════\n(()=>{\ncReveal('c3',()=>({\n  type:'bar',\n  data:{labels:['STARTER','PRO','TEAM','ENT'],\n    datasets:[{data:[182,486,391,274],\n      backgroundColor:['#C6C5BF',INK,'#8F8E88','#B0AFA9'],\n      borderRadius:{topLeft:99,topRight:99},borderSkipped:false,barPercentage:.52}]},\n  options:{\n    maintainAspectRatio:false,\n    animation:{duration:900,easing:'easeOutQuart',delay:c=>c.type==='data'?c.dataIndex*110:0},\n    plugins:{tooltip:{callbacks:{label:i=>'$'+i.raw+'K MRR'}}},\n    scales:{\n      x:{grid:{display:false},border:{display:false},ticks:{padding:8,font:{size:9,weight:600}}},\n      y:{display:false,suggestedMax:540},\n    },\n  },\n  plugins:[{\n    id:'topValues',\n    afterDatasetsDraw(chart){\n      const {ctx}=chart;\n      chart.getDatasetMeta(0).data.forEach((bar,i)=>{\n        ctx.save();ctx.font='700 13px Inter';ctx.fillStyle=INK;ctx.textAlign='center';\n        ctx.fillText('$'+chart.data.datasets[0].data[i]+'K',bar.x,bar.y-10);ctx.restore();\n      });\n    },\n  }],\n}));\n})();\n\n// ════ mono-redesign · donut → waffle of dots ════\n(()=>{\nconst NS='http://www.w3.org/2000/svg';\nconst mkEl=(svg,t,a)=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);svg.appendChild(n);return n};\nconst D=[['Search',34],['Referral',27],['Social',18],['Partners',12],['Paid',9]];\nobsReveal('waffle',s=>{\n  s.innerHTML='';\n  const COLS=10,CELL=21,R=7.5,X0=8,Y0=10;\n  let idx=0;\n  D.forEach(([name,v],g)=>{\n    for(let k=0;k\u003cv;k++){\n      const c=idx+k,row=Math.floor(c/COLS),col=c%COLS;\n      mkEl(s,'circle',{cx:X0+col*CELL+R,cy:Y0+row*CELL+R,r:R,fill:LAD[g],\n        class:'pop',style:`animation-delay:${c*.008+g*.05}s`});\n    }\n    idx+=v;\n  });\n  D.forEach(([name,v],g)=>{\n    const y=26+g*40;\n    mkEl(s,'circle',{cx:246,cy:y,r:6,fill:LAD[g]});\n    const n=mkEl(s,'text',{x:260,y:y-1,'font-size':10.5,'font-weight':600,fill:INK});\n    n.textContent=name;\n    const val=mkEl(s,'text',{x:260,y:y+13,'font-size':15,'font-weight':800,fill:g\u003c2?INK:'#8F8E88'});\n    val.textContent=v+'%';\n  });\n});\n})();\n\n// ════ mono-fancy · 1: pictorial bar forest ════\n(()=>{\nconst TREE='path://M20,0 L38,28 L29,28 L40,46 L26,46 L26,58 L14,58 L14,46 L0,46 L11,28 L2,28 Z';\nconst years=['2022','2023','2024','2025','2026'];\nconst vals=[26,41,63,88,117];\neReveal('forest',{\n  animationDuration:900,animationEasing:'quarticOut',animationDelay:i=>i*120,\n  tooltip:{...tipLight,formatter:p=>p.name+' — '+vals[p.dataIndex]+'k trees'},\n  grid:{left:44,right:56,top:10,bottom:8},\n  yAxis:{type:'category',data:years,inverse:true,\n    axisLine:{show:false},axisTick:{show:false},\n    axisLabel:{color:MUTED,fontFamily:'Inter',fontSize:10.5,fontWeight:700}},\n  xAxis:{show:false,max:13},\n  series:[{\n    type:'pictorialBar',symbol:TREE,\n    symbolRepeat:true,symbolSize:[17,24],symbolMargin:3,symbolClip:true,\n    data:vals.map((v,i)=>({name:years[i],value:v/10,itemStyle:{color:L[Math.max(0,4-i)]}})),\n    label:{show:true,position:'right',offset:[8,0],\n      color:INK,fontFamily:'Inter',fontSize:12,fontWeight:700,\n      formatter:p=>vals[p.dataIndex]+'k'},\n    z:10,\n  },{\n    type:'pictorialBar',symbol:TREE,\n    symbolRepeat:'fixed',symbolSize:[17,24],symbolMargin:3,symbolClip:true,\n    itemStyle:{color:'#DEDDD6'},data:years.map(()=>13),silent:true,z:5,\n  }],\n});\n})();\n\n// ════ mono-fancy · 2: circular graph on dark ════\n(()=>{\nconst teams=[\n  ['Product',52],['Design',38],['Frontend',46],['Backend',44],\n  ['Data',30],['Growth',34],['Support',22],['Ops',18],['Legal',9],['Finance',12],\n];\nconst links=[\n  [0,1,9],[0,2,8],[0,3,7],[1,2,9],[2,3,6],[3,4,7],[0,5,6],[5,4,5],\n  [5,6,4],[6,2,3],[7,3,4],[7,9,3],[8,9,2],[0,8,2],[4,2,4],[1,5,3],\n];\neReveal('circular',{\n  animationDuration:1200,animationEasing:'quarticOut',\n  tooltip:tipDark,\n  series:[{\n    type:'graph',layout:'circular',circular:{rotateLabel:false},\n    left:52,right:52,top:34,bottom:34,\n    data:teams.map(([n,v],i)=>({\n      name:n,value:v,symbolSize:v*.62,\n      itemStyle:{color:i\u003c4?PAPER:i\u003c8?'#8F8E88':'#4A4944',borderWidth:0},\n      label:{show:true,position:'right',distance:7,color:'#B3B0A4',fontFamily:'Inter',fontSize:9.5,fontWeight:600},\n    } s','series']});\n  },3000));\n});\n})();\n\n// ════ mono-fancy2 · 2: diverging bar ════\n(()=>{\nconst D=[\n  ['Enterprise',86],['Team',54],['Pro',31],['Starter',12],\n  ['Legacy Basic',-18],['Trial expired',-42],['Free dormant',-67],\n];\neReveal('negbar',{\n  animationDuration:900,animationEasing:'quarticOut',animationDelay:i=>i*80,\n  tooltip:{...tipLight,formatter:p=>p.name+' — '+(p.value>0?'+':'')+p.value+' accounts'},\n  grid:{left:96,right:52,top:8,bottom:8},\n  xAxis:{type:'value',\n    splitLine:{lineStyle:{color:'#DEDDD6'}},\n    axisLine:{show:false},axisTick:{show:false},axisLabel:{show:false}},\n  yAxis:{type:'category',data:D.map(d=>d[0]),inverse:true,\n    axisLine:{show:false},axisTick:{show:false},\n    axisLabel:{color:'#6A6963',fontFamily:'Inter',fontSize:9.5,fontWeight:600}},\n  series:[{\n    type:'bar',barWidth:16,\n    data:D.map(([n,v])=>({name:n,value:v,\n      itemStyle:{color:v>0?INK:'#B0AFA9',\n        borderRadius:v>0?[0,9,9,0]:[9,0,0,9]}})),\n    label:{show:true,fontFamily:'Inter',fontSize:11,fontWeight:700,\n      position:'outside',\n      formatter:p=>(p.value>0?'+':'')+p.value,color:INK},\n    markLine:{symbol:'none',silent:true,label:{show:false},\n      lineStyle:{color:'#8F8E88',width:1.5},\n      data:[{xAxis:0}]},\n  }],\n});\n})();\n\n// ════ force graph on dark: the network shakes itself into place ════\n// (replaced the axis-break bar — bars must never lie about length; house rule)\n(()=>{\nconst hubs=[['Core API',52,0]];\nconst apps=[\n  ['Slack',34,1],['GitHub',30,1],['Figma',22,1],['Notion',26,1],\n  ['Linear',18,1],['Drive',16,1],['Zoom',10,2],['Jira',14,2],\n  ['Sheets',12,2],['Intercom',8,2],['Stripe',20,1],['Segment',9,2],\n];\nconst nodes=[...hubs,...apps];\nconst links=[\n  ...apps.map((a,i)=>({source:a[0],target:'Core API',\n    lineStyle:{width:Math.max(.8,a[1]*.09),color:'#4A4840',opacity:.6}})),\n  // a few app-to-app side roads\n  {source:'Slack',target:'GitHub',lineStyle:{width:1.2,color:'#3A3934',opacity:.5} ut',\n  }],\n  animationDurationUpdate:640,\n  animationDelayUpdate:i=>i*36,\n});\n})();\n\n// ════ mono-fancy3 · 1: custom double-encoded pie ════\n(()=>{\nconst D=[\n  ['Editor',34,42],['Boards',22,31],['Docs',18,38],\n  ['Chat',12,11],['Automations',8,24],['Other',6,7],\n];\nconst SCALE=45;\nconst TAU=Math.PI*2;\nconst byShare=[...D].sort((a,b)=>b[1]-a[1]);\nconst minsDesc=D.map(d=>d[2]).sort((a,b)=>b-a);\nlet acc=0;\nconst slices=byShare.map(([n,share,mins])=>{\n  const p0=-Math.PI/2+acc/100*TAU, p1=-Math.PI/2+(acc+share)/100*TAU;\n  acc+=share;\n  return {n,share,mins,p0,p1,color:L[minsDesc.indexOf(mins)]};\n});\neReveal('custompie',{\n  animationDuration:900,animationEasing:'cubicOut',animationDelay:i=>i*130,\n  tooltip:{...tipLight,formatter:p=>{\n    const s=slices[p.dataIndex];\n    return s.n+' — '+s.share+'% of users · '+s.mins+' min/day';\n  }},\n  xAxis:{show:false,min:-1,max:1},\n  yAxis:{show:false,min:-1,max:1},\n  grid:{left:0,right:0,top:0,bottom:0},\n  series:[{\n    type:'custom',\n    renderItem:(params,api)=>{\n      const s=slices[params.dataIndex];\n      const cx=api.getWidth()/2, cy=api.getHeight()/2+6;\n      const R=Math.min(api.getWidth(),api.getHeight())*.37;\n      const r0=R*.24;\n      const rOf=m=>r0+(R-r0)*m/SCALE;\n      const pm=(s.p0+s.p1)/2, lr=R+14;\n      const cos=Math.cos(pm);\n      const kids=[];\n      if(params.dataIndex===0){\n        [15,30,45].forEach(m=>kids.push({type:'circle',\n          shape:{cx,cy,r:rOf(m)},\n          style:{fill:'none',stroke:'#D8D6CE',lineWidth:1,lineDash:[3,4]}}));\n      }\n      kids.push({type:'sector',\n        shape:{cx,cy,r0,r:rOf(s.mins),startAngle:s.p0,endAngle:s.p1,clockwise:true,cornerRadius:5},\n        style:{fill:s.color,stroke:PAPER,lineWidth:3},\n        enterFrom:{shape:{r:r0}}});\n      kids.push({type:'text',style:{\n        x:cx+cos*lr, y:cy+Math.sin(pm)*lr,\n        text:s.n+'  '+s.share+'% · '+s.mins+'m',\n        font:'600 10px Inter',fill:'#55544E',\n        align:Mat set:1,color:'rgba(28,28,26,0)'}]}},\n    }],\n  });\n  const t0=performance.now();\n  const tick=()=>{\n    if(my!==gen)return;\n    const p=Math.min(1,(performance.now()-t0)/DUR);\n    const eased=1-Math.pow(1-p,3);\n    const val=(TOTAL*eased/1000).toFixed(2);\n    g.setOption({graphic:[{id:'kpi',type:'group',left:16,top:8,children:[\n      {type:'text',style:{text:'$'+val+'M',font:'800 32px Inter',fill:INK}},\n      {type:'text',style:{text:'ARR · H1 2026',y:38,font:'600 10px Inter',fill:'#8F8E88'}},\n    ]}]});\n    if(p\u003c1)requestAnimationFrame(tick);\n  };\n  requestAnimationFrame(tick);\n});\n})();\n\naddEventListener('resize',()=>{\n  ['rose','forest','circular','tree','rainfall','morph','negbar','force','wave',\n   'custompie','singleaxis','jitter','race','stream','stroke']\n    .forEach(id=>echarts.getInstanceByDom(document.getElementById(id))?.resize());\n});\n\n// ── New chart-family helpers (scoped to the added templates) ──\n(()=>{\nconst INK='#1C1C1A',PAPER='#F0EFEB',MUTED='#8F8E88',GRID='#DEDDD6';\nconst NS='http://www.w3.org/2000/svg';\nconst el=(p,t,a)=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);p.appendChild(n);return n};\nconst txt=(p,a,s)=>{const n=el(p,'text',a);n.textContent=s;return n};\nconst tip=(n,s)=>{const t=document.createElementNS(NS,'title');t.textContent=s;n.appendChild(t)};\nconst rnd=(i,k)=>Math.abs(((i*73856093)^(k*19349663))%1000)/1000;\n\n// ════ G19 · violin ════\n// 小提琴：提前聚合的密度剪影，Glance 世界观（beeswarm 的姊妹）。\n// 四个 plan 各一把琴，宽度 = 该时长的工单密度（KDE），\n// 明度按中位数快慢排：越快越黑。纸色横档 = 中位数。\n(()=>{\nconst G=[['ENT',1.6,.8],['PRO',3.4,1.6],['STARTER',6.2,2.6],['FREE',9.5,4.2]];\nconst M=64;\nconst samples=g=>Array.from({length:M},(_,i)=>{\n  const [,c,s]=G[g];\n  const v=c+s*((rnd(i+1,g*3+1)+rnd(i+7,g*3+2)+rnd(i+13,g*3+3))-1.5);\n  return Math.max(.2,v);\n});\nobsReveal('violin',s=>{\n  const TOP=40,BASE=262,HMAX=17;\n  const mapY=h=>BASE-h/HMAX*(BASE-TOP);\n  const colX=g=>76+g*84;\n  // hour grid\n  [0,4,8,12,16].forEach(h=>{\n    el(s,'line',{x1:34,y1:mapY(h),x2:378,y2:mapY(h),stroke:'#E3E2DB','stroke-width':.8,\n      class:'fade',style:`animation-delay:${h*.01}s`});\n    txt(s,{x:28,y:mapY(h)+3,'font-size':7.5,'font-weight':600,fill:MUTED,'text-anchor':'end',\n      class:'fade',style:`animation-delay:${h*.01}s`},h+'h');\n  });\n  const SHADE=[INK,'#4A4944','#8F8E88','#B0AFA9'];\n  G.forEach(([name],g)=>{\n    const vs=samples(g).sort((a,b)=>a-b);\n    const med=vs[Math.floor(M/2)];\n    // fuller bandwidth = the classic rounded violin belly, not a spindle\n    const bw=Math.max(.9,G[g][2]*.72);\n    // pad past the data by 1.6 bandwidths so the density decays to ~0 and the\n    // ends taper naturally — clipping tighter gives flat-cut lantern ends\n    const lo=Math.max(0,vs[0]-bw*1.6),hi=Math.min(HMAX,vs[M-1]+bw*1.6);\n    const NPTS=44;\n    const grid=Array.from({length:NPTS},(_,k)=>lo+k/(NPTS-1)*(hi-lo));\n    const dens=grid.map(h=>vs.reduce((a,v)=>a+Math.exp(-((h-v)**2)/(2*bw*bw)),0));\n    const dmax=Math.max(...dens);\n    const W=30;\n    const x=colX(g);\n    // smooth closed outline through the mirrored density — quadratic\n    // midpoint smoothing, same trick as almanac's blob\n    const pts=[];\n    grid.forEach((h,k)=>pts.push([x+dens[k]/dmax*W,mapY(h)]));\n    for(let k=NPTS-1;k>=0;k--)pts.push([x-dens[k]/dmax*W,mapY(grid[k])]);\n    let d=`M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;\n    for(let t=0;t\u003cpts.length;t++){\n      const p=pts[t],q=pts[(t+1)%pts.length];\n      d+=` Q${p[0].toFixed(1)} ${p[1].toFixed(1)} ${((p[0]+q[0])/2).toFixed(1)} ${((p[1]+q[1])/2).toFixed(1)}`;\n    }\n    const body=el(s,'path',{d:d+' Z',fill:SHADE[g],class:'fade',style:`animation-delay:${g*.14}s`});\n    tip(body,`${name} — median ${med.toFixed(1)}h to first reply`);\n    // median: paper tick across the body, value parked right\n    const mk=Math.round((med-lo)/(hi-lo)*(NPTS-1));\n    const wAtMed=dens[Math.max(0,Math.min(NPTS-1,mk))]/dmax*W;\n    el(s,'line',{x1:x-wAtMed,y1:mapY(med),x2:x+wAtMed,y2:mapY(med),\n      stroke:PAPER,'stroke-width':2.2,class:'fade',style:`animation-delay:${.5+g*.14}s`});\n    txt(s,{x:x+W+5,y:mapY(med)+3,'font-size':9.5,'font-weight':800,fill:INK,\n      class:'fade',style:`animation-delay:${.6+g*.14}s`},med.toFixed(1)+'h');\n    txt(s,{x,y:BASE+18,'font-size':7.5,'font-weight':700,fill:MUTED,'text-anchor':'middle',\n      'letter-spacing':'.08em',class:'fade',style:`animation-delay:${g*.14}s`},name);\n  });\n  txt(s,{x:200,y:306,'font-size':7,'font-weight':600,fill:'#B0AFA9','text-anchor':'middle',\n    'letter-spacing':'.12em',class:'fade',style:'animation-delay:1.1s'},\n    'WIDTH = HOW MANY TICKETS WAIT THAT LONG · PAPER TICK = MEDIAN · DARKEST = FASTEST');\n});\n})();\n\n// ════ G20 · matrix heat ════\n// 矩阵热力的 Glance 皮：粗笔画版本。大圆角色块、每格标数、3 秒读出\n// 「新版本跑得黑」的对角线。和 P1 Lupi 皮同数据形状，读者时间不同。\n(()=>{\nconst FEAT=['EDITOR','BOARDS','DOCS','CHAT','FLOWS','VAULT'];\nconst VER=['v2.0','v1.9','v1.8','v1.7','v1.6'];\nconst BASEV=[88,74,61,42,35,27];\nconst v=(r,c)=>Math.max(2,Math.round(BASEV[c]-r*(6+c*.8)+(rnd(r*6+c+1,c+3)-.5)*10));\nconst shade=t=>t>64?INK:t>46?'#4A4944':t>30?'#8F8E88':t>15?'#B0AFA9':'#D8D7D1';\nobsReveal('gheat',s=>{\n  const X0=92,Y0=58,PX=48,PY=42,W=42,H=36;\n  FEAT.forEach((f,c)=>{\n    txt(s,{x:X0+c*PX+W/2,y:Y0-12,'font-size':6.5,'font-weight':700,fill:MUTED,'text-anchor':'middle',\n      'letter-spacing':'.04em',class:'fade',style:`animation-delay:${c*.04}s`},f);\n  });\n  VER.forEach((ver,r)=>{\n    txt(s,{x:X0-10,y:Y0+r*PY+H/2+3,'font-size':8.5,'font-weight':700,fill:'#6A6963','text-anchor':'end',\n      class:'fade',style:`animation-delay:${r*.05}s`},ver);\n    FEAT.forEach((f,c)=>{\n      const t=v(r,c),x=X0+c*PX,y=Y0+r*PY,dark=t>46;\n      const cell=el(s,'rect',{x,y,width:W,height:H,rx:9,fill:shade(t),\n        class:'pop',style:`animation-delay:${(r*6+c)*.022}s`});\n      tip(cell,`${f} on ${ver} — ${t}% of accounts`);\n      txt(s,{x:x+W/2,y:y+H/2+4,'font-size':10.5,'font-weight':800,fill:dark?PAPER:INK,'text-anchor':'middle',\n        class:'fade',style:`animation-delay:${.15+(r*6+c)*.022}s`},t);\n    });\n  });\n  txt(s,{x:200,y:300,'font-size':7,'font-weight':600,fill:'#B0AFA9','text-anchor':'middle',\n    'letter-spacing':'.12em',class:'fade',style:'animation-delay:1s'},\n    'SHADE = ADOPTION · NEWER VERSIONS RUN DARKER');\n});\n})();\n\n// ════ G21 · rank strip ════\n// 排名随时间变的静态版，第二稿。第一稿是泳道 bump——灰线 X 交叉，\n// 和 slope 同一种丑（catalog 实测三连败那条），废弃。\n// 这版不画线：一行一个产品，一格一个季度，明度 = 名次（#1 最黑）。\n// 攀升者的行自己从浅变黑，故事读行内渐变，不读交叉。\n(()=>{\nconst RANKS=[['Flows',[5,3,2,1,1,1]],['Editor',[1,1,1,2,2,2]],['Boards',[2,2,3,3,3,4]],\n  ['Vault',[4,5,5,4,4,3]],['Docs',[3,4,4,5,5,5]]];\nconst SHADE=[INK,'#4A4944','#8F8E88','#B0AFA9','#D8D7D1'];   // rank 1 → 5\nobsReveal('rankstrip',s=>{\n  // rows sorted by final rank, the climber lands on top\n  const rows=[...RANKS].sort((a,b)=>a[1][5]-b[1][5]);\n  const X0=110,PX=38,Y0=64,PY=42,C=32;\n  ['Q1','Q2','Q3','Q4','Q5','Q6'].forEach((q,k)=>\n    txt(s,{x:X0+k*PX+C/2,y:Y0-12,'font-size':7.5,'font-weight':600,fill:MUTED,'text-anchor':'middle',\n      'letter-spacing':'.08em',class:'fade',style:`animation-delay:${k*.04}s`},q));\n  rows.forEach(([p,rk],i)=>{\n    const y=Y0+i*PY,hero=p==='Flows';\n    txt(s,{x:X0-12,y:y+C/2+3,'font-size':8.5,'font-weight':hero?800:600,fill:hero?INK:'#6A6963','text-anchor':'end',\n      class:'fade',style:`animation-delay:${i*.07}s`},p);\n    rk.forEach((r,q)=>{\n      const dark=r\u003c=2;\n      const cell=el(s,'rect',{x:X0+q*PX,y,width:C,height:C,rx:8,fill:SHADE[r-1],\n        stroke:'#CFCEC7','stroke-width':.5,\n        class:'pop',style:`animation-delay:${i*.07+q*.035}s`});\n      tip(cell,`${p} — #${r} in Q${q+1}`);\n      txt(s,{x:X0+q*PX+C/2,y:y+C/2+3.5,'font-size':9.5,'font-weight':800,\n        fill:dark?PAPER:'#55544E','text-anchor':'middle',\n        class:'fade',style:`animation-delay:${.1+i*.07+q*.035}s`},r);\n    });\n    // arrival flag: climbed / fell / held, told at the row's end\n    const d=rk[0]-rk[5];\n    txt(s,{x:X0+6*PX+8,y:y+C/2+3,'font-size':8,'font-weight':800,\n      fill:d>0?INK:d\u003c0?'#B0AFA9':'#C6C5BF',\n      class:'fade',style:`animation-delay:${.5+i*.07}s`},\n      d>0?'▲'+d:d\u003c0?'▼'+(-d):'—');\n  });\n  txt(s,{x:200,y:308,'font-size':7,'font-weight':600,fill:'#B0AFA9','text-anchor':'middle',\n    'letter-spacing':'.12em',class:'fade',style:'animation-delay:1.1s'},\n    'CELL = RANK THAT QUARTER · #1 WEARS BLACK · READ EACH ROW LIKE A FILMSTRIP');\n});\n})();\n\n// ════ G22 · aggregate sankey ════\n// B3 Threads 是逐条丝线（每线一条记录）；这张是聚合版——\n// 缎带宽度∝账号数。左渠道右套餐，缎带按渠道明度分。\n// 交叉处必须读得清，缎带走 .5 透明度（同 convergence 连线的处理）。\n(()=>{\nconst SRC=[['SEARCH',[20,10,4]],['REFERRAL',[12,9,6]],['SOCIAL',[12,4,2]],['PAID',[6,3,3]],['OTHER',[5,2,2]]];\nconst DST=['FREE','PRO','TEAM'];\nconst SH=[INK,'#4A4944','#8F8E88','#B0AFA9','#C6C5BF'];\nobsReveal('sankey',s=>{\n  const XL=104,XR=298,Y0=34,SC=1.9,GAPL=8,GAPR=22,MID=(XL+XR)/2;\n  const srcTot=SRC.map(d=>d[1].reduce((a,b)=>a+b,0));\n  const dstTot=DST.map((_,j)=>SRC.reduce((a,d)=>a+d[1][j],0));\n  const sy=[],dy=[];\n  let y=Y0;srcTot.forEach((t,i)=>{sy[i]=y;y+=t*SC+GAPL});\n  y=Y0+2;dstTot.forEach((t,j)=>{dy[j]=y;y+=t*SC+GAPR});\n  const syc=[...sy],dyc=[...dy];\n  SRC.forEach((d,i)=>{\n    d[1].forEach((v,j)=>{\n      if(!v)return;\n      const sa=syc[i],sb=sa+v*SC,da=dyc[j],db=da+v*SC;\n      syc[i]=sb;dyc[j]=db;\n      const rib=el(s,'path',{d:`M${XL} ${sa} C${MID} ${sa} ${MID} ${da} ${XR} ${da} L${XR} ${db} C${MID} ${db} ${MID} ${sb} ${XL} ${sb} Z`,\n        fill:SH[i],opacity:.5,class:'fade',style:`animation-delay:${.2+(i*3+j)*.06}s`});\n      tip(rib,`${SRC[i][0]} → ${DST[j]} — ${v} accounts of 100`);\n    });\n  });\n  SRC.forEach((d,i)=>{\n    el(s,'rect',{x:XL-9,y:sy[i],width:9,height:srcTot[i]*SC,rx:4,fill:SH[i],\n      class:'fade',style:`animation-delay:${i*.06}s`});\n    txt(s,{x:XL-16,y:sy[i]+srcTot[i]*SC/2+2.5,'font-size':7.5,'font-weight':700,fill:'#4A4944','text-anchor':'end',\n      'letter-spacing':'.05em',class:'fade',style:`animation-delay:${i*.06}s`},`${d[0]} · ${srcTot[i]}`);\n  });\n  DST.forEach((n,j)=>{\n    el(s,'rect',{x:XR,y:dy[j],width:9,height:dstTot[j]*SC,rx:4,fill:'#3A3934',\n      class:'fade',style:`animation-delay:${.1+j*.06}s`});\n    txt(s,{x:XR+16,y:dy[j]+dstTot[j]*SC/2-3,'font-size':7.5,'font-weight':700,fill:'#4A4944',\n      'letter-spacing':'.05em',class:'fade',style:`animation-delay:${.15+j*.06}s`},n);\n    txt(s,{x:XR+16,y:dy[j]+dstTot[j]*SC/2+9,'font-size':10,'font-weight':800,fill:INK,\n      class:'fade',style:`animation-delay:${.2+j*.06}s`},dstTot[j]);\n  });\n  txt(s,{x:200,y:302,'font-size':7,'font-weight':600,fill:'#B0AFA9','text-anchor':'middle',\n    'letter-spacing':'.12em',class:'fade',style:'animation-delay:1.1s'},\n    'RIBBON WIDTH = ACCOUNTS OF 100 · SHADE = CHANNEL');\n});\n})();\n})();\n\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"},"maps":{"label":"Maps · 2 张","html":"\u003c!doctype html>\n\u003chtml lang=\"zh\">\n\u003chead>\n\u003cmeta charset=\"utf-8\" />\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\" />\n\u003ctitle>Lieflat Charts · Maps · 2 张参考实现\u003c/title>\n\u003cscript src=\"https://cdn.jsdelivr.net/npm/echarts@6/dist/echarts.min.js\">\u003c/script>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{--bg:#F0EFEB;--dark:#1C1C1A;--ink:#1C1C1A;--muted:#8F8E88;--faint:#C6C5BF;--grid:#DEDDD6}\n  *{margin:0;padding:0;box-sizing:border-box}\n  body{background:var(--bg);font-family:'Inter',sans-serif;color:var(--ink);padding:40px;-webkit-font-smoothing:antialiased}\n  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px;max-width:1400px;margin:0 auto}\n  .card{background:var(--bg);border-radius:24px;padding:28px 28px 20px}\n  .card.wide{grid-column:1/-1}\n  h2{font-weight:700;font-size:16.5px;letter-spacing:-.02em;margin-bottom:3px}\n  .sub{font-size:11.5px;color:var(--muted);margin-bottom:14px}\n  .src{font-size:9.5px;color:var(--faint);margin-top:10px;letter-spacing:.08em;font-weight:500}\n  .badge{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.08em;\n    padding:3px 10px;border-radius:99px;margin-bottom:10px;border:1px dashed #B0AFA9;color:#8F8E88}\n  svg{width:100%;max-height:330px;display:block;margin:0 auto}\n  svg text{font-family:'Inter',sans-serif}\n  .pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,.7,.3,1.3) both}\n  @keyframes pop{from{transform:scale(0)}to{transform:none}}\n  .fade{animation:fade .9s ease both}\n  @keyframes fade{from{opacity:0}}\n  .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s cubic-bezier(.4,0,.2,1) both}\n  @keyframes draw{to{stroke-dashoffset:0}}\n  @media (prefers-reduced-motion:reduce){\n    .pop,.fade{animation:none}\n    .draw{animation:none;stroke-dasharray:none;stroke-dashoffset:0}\n  }\n  .pagehead{max-width:1400px;margin:0 auto 26px;padding:0 4px}\n  .pagehead h1{font-size:22px;letter-spacing:-.02em;font-weight:800}\n  .pagehead p{font-size:12px;color:#8F8E88;margin-top:5px;line-height:1.7}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"pagehead\">\n  \u003ch1>Maps · 2 张参考实现\u003c/h1>\n  \u003cp>仅在用户明确要求地图或地域分布时使用。M1 为美国州级，M2 为世界国家级；地图数据与 ECharts 通过网络加载。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"grid2\">\n  \u003c!-- M1 · US Choropleth -->\n  \u003cdiv class=\"card\">\n    \u003cspan class=\"badge\">MAPS · US CHOROPLETH\u003c/span>\n    \u003ch2>Sign-ups across the states\u003c/h2>\n    \u003cdiv class=\"sub\">real outlines · Alaska and Hawaii tucked lower-left · shade = sign-ups, five steps · needs the network for map data\u003c/div>\n    \u003cdiv class=\"ch\" id=\"mapus\" style=\"height:340px\">\u003c/div>\n    \u003cdiv class=\"src\">CHOROPLETH · MONO-MAP · GROWTH GEO\u003c/div>\n  \u003c/div>\n\n  \u003c!-- M2 · World Choropleth -->\n  \u003cdiv class=\"card wide\">\n    \u003cspan class=\"badge\">MAPS · WORLD CHOROPLETH\u003c/span>\n    \u003ch2>Where the users are\u003c/h2>\n    \u003cdiv class=\"sub\">real outlines · shade = monthly active accounts · gray = markets we haven't opened\u003c/div>\n    \u003cdiv class=\"ch\" id=\"mapworld\" style=\"height:400px\">\u003c/div>\n    \u003cdiv class=\"src\">CHOROPLETH · MONO-MAP · GLOBAL OPS\u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003cscript>\nconst INK='#1C1C1A',PAPER='#F0EFEB',MUTED='#8F8E88',GRID='#DEDDD6';\nconst obsReveal=(id,fn)=>{\n  const n=document.getElementById(id);\n  const go=()=>fn(n);\n  const io=new IntersectionObserver(es=>{if(es[0].isIntersecting){go();io.disconnect()}},{threshold:.3});\n  io.observe(n);\n  n.style.cursor='pointer';\n  n.addEventListener('click',go);\n};\n\n// ════ M1 · US choropleth ════\n// 真轮廓地图：ECharts registerMap + GeoJSON（ECharts 官方示例数据，jsdelivr）。\n// 阿拉斯加/夏威夷/波多黎各用 registerMap 第三参 specialAreas 收进左下角\n// （官方 USA 示例同款，零额外依赖；d3 albersUsa 投影方案在部分环境渲染空白，弃用）。\n// Mono 化三件事：piecewise 五档灰阶 visualMap（明度即数据）、\n// 纸色描边当州界发丝、无数据州留 #E4E3DC（沉默可见）。\n// 面积失真的坦白：州的大小是地理，不是数值（蒙大拿大 ≠ 蒙大拿多）。\n// ⚠️ 如果换成中国地图：数据源必须含台湾省 + 南海诸岛 + 九段线\n// （用 DataV GeoAtlas 100000_full 或其完整镜像），发布前核对当期审图号。\nconst MAP_LEGEND={\n  itemWidth:11,itemHeight:11,itemSymbol:'rect',\n  textStyle:{fontFamily:'Inter',fontSize:9,color:'#8F8E88'},\n  inRange:{color:['#D8D7D1','#B0AFA9','#8F8E88','#4A4944','#1C1C1A']},\n};\n(()=>{\nconst D={'California':96,'New York':78,'Texas':72,'Washington':68,'Massachusetts':66,\n  'Florida':54,'Illinois':49,'Colorado':44,'Georgia':41,'Virginia':33,'Pennsylvania':31,\n  'North Carolina':30,'New Jersey':28,'Oregon':22,'Ohio':21,'Michigan':19,'Arizona':18,\n  'Minnesota':16,'Utah':15,'Maryland':14,'Tennessee':13,'Wisconsin':12,'Missouri':11,\n  'Indiana':9,'Nevada':8,'Connecticut':7,'South Carolina':6,'Alabama':5,'Kentucky':5,\n  'Oklahoma':4,'Iowa':4,'Kansas':3,'Arkansas':3,'Louisiana':3,'New Hampshire':2,\n  'Idaho':2,'New Mexico':2,'Hawaii':2,'Maine':1,'Nebraska':1,'Alaska':1};\nfetch('https://cdn.jsdelivr.net/gh/apache/echarts-examples@gh-pages/public/data/asset/geo/USA.json')\n  .then(r=>r.json()).then(geo=>{\n    echarts.registerMap('mono-usa',geo,{\n      Alaska:{left:-131,top:25,width:15},\n      Hawaii:{left:-110,top:28,width:5},\n      'Puerto Rico':{left:-76,top:26,width:2},\n    });\n    const opt={\n      animationDuration:900,animationEasing:'quarticOut',\n      tooltip:{backgroundColor:INK,borderWidth:0,padding:[10,14],\n        textStyle:{color:PAPER,fontFamily:'Inter',fontSize:12},\n        formatter:p=>isNaN(p.value)?p.name+' — no data':p.name+' — '+p.value+'k sign-ups'},\n      visualMap:{type:'piecewise',bottom:6,left:'center',orient:'horizontal',\n        pieces:[{max:9,label:'≤9k'},{min:10,max:20,label:'10–20k'},{min:21,max:38,label:'21–38k'},\n          {min:39,max:64,label:'39–64k'},{min:65,label:'65k+'}],\n        ...MAP_LEGEND},\n      series:[{type:'map',map:'mono-usa',top:10,bottom:48,\n        itemStyle:{areaColor:'#E4E3DC',borderColor:PAPER,borderWidth:1},\n        emphasis:{label:{show:true,fontFamily:'Inter',fontSize:10,fontWeight:800,color:INK,\n          textBorderColor:PAPER,textBorderWidth:3},\n          itemStyle:{areaColor:null,borderColor:INK,borderWidth:1.2}},\n        select:{disabled:true},\n        data:Object.entries(D).map(([n,v])=>({name:n,value:v,\n          label:n==='California'?{show:true,formatter:'CA 96k',fontFamily:'Inter',fontSize:9,\n            fontWeight:800,color:PAPER,textBorderColor:INK,textBorderWidth:2}:undefined})),\n      }],\n    };\n    obsReveal('mapus',elDom=>{\n      const g=echarts.getInstanceByDom(elDom)||echarts.init(elDom);\n      g.clear();g.setOption(opt);\n    });\n  });\n})();\n\n// ════ M2 · World choropleth ════\n// 世界真轮廓版。同一套 Mono 化规则；用 boundingCoords 裁掉南极，\n// 关键市场（≥39k）直接把数值标在版图上。\n(()=>{\nconst D={'United States':95,'India':62,'United Kingdom':48,'Germany':41,'Brazil':39,'Canada':34,\n  'France':30,'Australia':28,'China':26,'Japan':26,'Korea':21,'Spain':19,'Italy':17,'Singapore':16,\n  'Indonesia':15,'Mexico':14,'Netherlands':13,'Poland':13,'Sweden':12,'Ireland':12,'Philippines':11,\n  'Turkey':10,'Vietnam':9,'South Africa':9,'Denmark':9,'Norway':8,'Thailand':8,'Malaysia':8,\n  'United Arab Emirates':8,'Argentina':7,'Finland':7,'Nigeria':7,'Chile':6,'Colombia':6,\n  'Saudi Arabia':6,'Ukraine':6,'New Zealand':6,'Egypt':5,'Pakistan':5,'Russia':5,'Portugal':5,\n  'Greece':4,'Kenya':4,'Peru':4,'Morocco':3,'Iceland':2,'Iran':2,'Kazakhstan':2,'Ethiopia':2,\n  'Ghana':2,'Ecuador':2,'Algeria':2,'Mongolia':1,'Libya':1};\nconst BIG={'United States':['US 95k',[0,0]],'India':['IN 62k',[0,4]],\n  'United Kingdom':['UK 48k',[-26,-12]],'Germany':['DE 41k',[26,14]],'Brazil':['BR 39k',[0,0]]};\nfetch('https://cdn.jsdelivr.net/npm/echarts@4.9.0/map/json/world.json')\n  .then(r=>r.json()).then(geo=>{\n    echarts.registerMap('mono-world',geo);\n    const opt={\n      animationDuration:900,animationEasing:'quarticOut',\n      tooltip:{backgroundColor:INK,borderWidth:0,padding:[10,14],\n        textStyle:{color:PAPER,fontFamily:'Inter',fontSize:12},\n        formatter:p=>isNaN(p.value)?p.name+' — not opened yet':p.name+' — '+p.value+'k MAU'},\n      visualMap:{type:'piecewise',bottom:2,left:'center',orient:'horizontal',\n        pieces:[{max:9,label:'≤9k'},{min:10,max:20,label:'10–20k'},{min:21,max:38,label:'21–38k'},\n          {min:39,max:64,label:'39–64k'},{min:65,label:'65k+'}],\n        ...MAP_LEGEND},\n      series:[{type:'map',map:'mono-world',top:4,bottom:36,\n        boundingCoords:[[-170,76],[190,-58]],   // crop antarctica\n        itemStyle:{areaColor:'#E4E3DC',borderColor:PAPER,borderWidth:.7},\n        emphasis:{label:{show:true,fontFamily:'Inter',fontSize:10,fontWeight:800,color:INK,\n          textBorderColor:PAPER,textBorderWidth:3},\n          itemStyle:{areaColor:null,borderColor:INK,borderWidth:1.1}},\n        select:{disabled:true},\n        data:Object.entries(D).map(([n,v])=>({name:n,value:v,\n          label:BIG[n]?{show:true,formatter:BIG[n][0],offset:BIG[n][1],fontFamily:'Inter',fontSize:8.5,\n            fontWeight:800,color:INK,textBorderColor:PAPER,textBorderWidth:3}:undefined})),\n      }],\n    };\n    obsReveal('mapworld',elDom=>{\n      const g=echarts.getInstanceByDom(elDom)||echarts.init(elDom);\n      g.clear();g.setOption(opt);\n    });\n  });\n})();\n\naddEventListener('resize',()=>{\n  ['mapus','mapworld'].forEach(id=>echarts.getInstanceByDom(document.getElementById(id))?.resize());\n});\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"},"circular":{"label":"Circular Graph · B1","html":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\" />\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\" />\n\u003ctitle>Mono — Circular Graph, Dense\u003c/title>\n\u003cscript src=\"https://cdn.jsdelivr.net/npm/echarts@6/dist/echarts.min.js\">\u003c/script>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n  :root{--bg:#F0EFEB;--dark:#1C1C1A}\n  *{margin:0;padding:0;box-sizing:border-box}\n  body{background:var(--bg);font-family:'Inter',sans-serif;padding:40px;-webkit-font-smoothing:antialiased;\n    display:flex;justify-content:center}\n  .card{background:var(--dark);color:#F0EFEB;border-radius:24px;padding:34px 34px 24px;\n    width:min(1100px,100%)}\n  h2{font-weight:700;font-size:19px;letter-spacing:-.02em;margin-bottom:4px}\n  .sub{font-size:12px;color:#8F8E88;margin-bottom:10px}\n  .src{font-size:9.5px;color:#55554F;margin-top:12px;letter-spacing:.08em;font-weight:500}\n  #ch{height:78vh;min-height:620px;cursor:pointer}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"card\">\n  \u003ch2>Six hundred collaborations, one ring\u003c/h2>\n  \u003cdiv class=\"sub\">60 repos · line = shared contributors · hover a repo to light up its world · click to replay\u003c/div>\n  \u003cdiv id=\"ch\">\u003c/div>\n  \u003cdiv class=\"src\">CIRCULAR GRAPH · DENSE · SOURCE · GIT LOG\u003c/div>\n\u003c/div>\n\u003cscript>\nconst INK='#1C1C1A',PAPER='#F0EFEB';\nconst rnd=(i,k)=>((i*73856093)^(k*19349663))%1000/1000; // deterministic\n\n// ── 60 repos in 5 org clusters; cluster = shade family ──\nconst ORGS=[\n  ['platform',16,'#F0EFEB'],   // paper — the core\n  ['product',14,'#C9C7BD'],\n  ['data',12,'#A5A39A'],\n  ['infra',10,'#8F8E88'],\n  ['labs',8,'#6A6963'],\n];\nconst nodes=[];\nORGS.forEach(([org,count],oi)=>{\n  for(let i=0;i\u003ccount;i++){\n    // activity: a few giants per cluster, long tail of small repos\n    const heavy=i\u003c2?30+rnd(oi+1,i+2)*45:4+rnd(oi+3,i+7)*16;\n    nodes.push({\n      name:org+'/'+org.slice(0,2)+'-'+String(i+1).padStart(2,'0'),\n      org:oi,value:Math.round(heavy),\n    });\n  }\n});\n// links: dense inside a cluster, sparser across; weight = shared contributors\nconst links=[];\nconst idx={};nodes.forEach((n,i)=>idx[n.name]=i);\nnodes.forEach((a,i)=>{\n  nodes.forEach((b,j)=>{\n    if(j\u003c=i)return;\n    const same=a.org===b.org;\n    const p=same?.16:.045;\n    if(rnd(i+1,j+2)\u003cp){\n      links.push({source:i,target:j,\n        w:1+Math.round(rnd(i+2,j+3)*6),same});\n    }\n  });\n});\n\nconst g=echarts.init(document.getElementById('ch'));\nconst opt={\n  animationDuration:1800,animationEasing:'quarticOut',\n  tooltip:{backgroundColor:PAPER,borderWidth:0,\n    textStyle:{color:INK,fontFamily:'Inter',fontSize:12},padding:[10,14],\n    formatter:p=>p.dataType==='node'\n      ?p.name+' — '+p.value+' contributors'\n      :p.data.rawS+' ↔ '+p.data.rawT+' — '+p.data.w+' shared'},\n  series:[{\n    type:'graph',layout:'circular',\n    circular:{rotateLabel:true},\n    left:24,right:24,top:24,bottom:24,\n    data:nodes.map((n,i)=>({\n      name:n.name,value:n.value,\n      symbolSize:3.5+Math.sqrt(n.value)*1.7,\n      itemStyle:{color:ORGS[n.org][2],borderWidth:0},\n      // only the giants get a label — 60 names would be soup\n      label:{show:n.value>=26,position:'right',distance:4,\n        color:'#B3B0A4',fontFamily:'Inter',fontSize:8.5,fontWeight:600},\n    })),\n    links:links.map(l=>({\n      source:l.source,target:l.target,\n      rawS:nodes[l.source].name,rawT:nodes[l.target].name,w:l.w,\n      lineStyle:{\n        width:.4+l.w*.28,\n        color:l.same?'#55534B':'#3A3934',\n        opacity:l.same?.5:.32,\n        curveness:.3,\n      },\n    })),\n    emphasis:{\n      focus:'adjacency',\n      lineStyle:{color:PAPER,opacity:.9,width:1.6},\n      label:{show:true,color:PAPER},\n    },\n    blur:{itemStyle:{opacity:.12},lineStyle:{opacity:.03}},\n  }],\n};\nconst play=()=>{g.clear();g.setOption(opt)};\nplay();\ndocument.getElementById('ch').addEventListener('click',play);\naddEventListener('resize',()=>g.resize());\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"},"force":{"label":"Force Graph · B2","html":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\" />\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\" />\n\u003ctitle>Mono — Force Graph, Dense\u003c/title>\n\u003cscript src=\"https://cdn.jsdelivr.net/npm/echarts@6/dist/echarts.min.js\">\u003c/script>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n  :root{--bg:#F0EFEB;--dark:#1C1C1A}\n  *{margin:0;padding:0;box-sizing:border-box}\n  body{background:var(--bg);font-family:'Inter',sans-serif;padding:40px;-webkit-font-smoothing:antialiased;\n    display:flex;justify-content:center}\n  .card{background:var(--dark);color:#F0EFEB;border-radius:24px;padding:34px 34px 24px;\n    width:min(1100px,100%)}\n  h2{font-weight:700;font-size:19px;letter-spacing:-.02em;margin-bottom:4px}\n  .sub{font-size:12px;color:#8F8E88;margin-bottom:10px}\n  .src{font-size:9.5px;color:#55554F;margin-top:12px;letter-spacing:.08em;font-weight:500}\n  #ch{height:78vh;min-height:620px;cursor:grab}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"card\">\n  \u003ch2>A galaxy of one hundred eighty services\u003c/h2>\n  \u003cdiv class=\"sub\">8 domains self-organize · node = call volume · drag anything, the galaxy fights back · click empty space to replay\u003c/div>\n  \u003cdiv id=\"ch\">\u003c/div>\n  \u003cdiv class=\"src\">FORCE GRAPH · DENSE · SOURCE · SERVICE MESH\u003c/div>\n\u003c/div>\n\u003cscript>\nconst INK='#1C1C1A',PAPER='#F0EFEB';\nconst rnd=(i,k)=>((i*73856093)^(k*19349663))%1000/1000; // deterministic\n\n// ── 8 domain hubs, each with a swarm of services; hubs interconnect ──\nconst DOMAINS=[\n  ['auth',26,'#F0EFEB'],['billing',24,'#DCDAD2'],['content',28,'#C9C7BD'],\n  ['search',20,'#B3B0A4'],['notify',22,'#9C9A91'],['media',20,'#8F8E88'],\n  ['analytics',18,'#7C7A72'],['edge',14,'#6A6963'],\n];\nconst nodes=[],links=[];\nDOMAINS.forEach(([dom,count,shade],di)=>{\n  // the hub\n  nodes.push({name:dom,value:60+Math.round(rnd(di+1,3)*50),hub:true,shade,dom:di});\n  // satellites: long-tail sizes, a couple of mid-weights per domain\n  for(let i=0;i\u003ccount;i++){\n    const v=i\u003c3?14+rnd(di+2,i+4)*18:2+rnd(di+5,i+9)*9;\n    const name=dom+'-'+String(i+1).padStart(2,'0');\n    nodes.push({name,value:Math.round(v),hub:false,shade,dom:di});\n    // satellite -> its hub\n    links.push({source:name,target:dom,\n      lineStyle:{width:.5+v*.05,color:'#3F3E38',opacity:.5}});\n    // occasional satellite-to-satellite shortcut inside the domain\n    if(i>1&&rnd(di+3,i+11)\u003c.22){\n      links.push({source:name,target:dom+'-'+String(1+Math.floor(rnd(di+4,i+13)*i)).padStart(2,'0'),\n        lineStyle:{width:.5,color:'#33322D',opacity:.4}});\n    }\n  }\n});\n// hub-to-hub backbone: every domain talks to 2-3 others\nconst H=DOMAINS.length;\nfor(let a=0;a\u003cH;a++)for(let b=a+1;b\u003cH;b++){\n  if(rnd(a+7,b+9)\u003c.42){\n    links.push({source:DOMAINS[a][0],target:DOMAINS[b][0],\n      lineStyle:{width:1.6+rnd(a+2,b+3)*2.2,color:'#55534B',opacity:.65,curveness:.08}});\n  }\n}\n// a few cross-domain satellite shortcuts — the messy real-world wires\nfor(let k=0;k\u003c26;k++){\n  const a=nodes[1+Math.floor(rnd(k+1,17)*(nodes.length-1))];\n  const b=nodes[1+Math.floor(rnd(k+3,23)*(nodes.length-1))];\n  if(a.name!==b.name&&a.dom!==b.dom&&!a.hub&&!b.hub){\n    links.push({source:a.name,target:b.name,\n      lineStyle:{width:.5,color:'#2E2D29',opacity:.38,curveness:.15}});\n  }\n}\n\nconst g=echarts.init(document.getElementById('ch'));\nconst opt={\n  animationDuration:300,\n  tooltip:{backgroundColor:PAPER,borderWidth:0,\n    textStyle:{color:INK,fontFamily:'Inter',fontSize:12},padding:[10,14],\n    formatter:p=>p.dataType==='node'?p.name+' — '+p.value+'k calls/day':''},\n  series:[{\n    type:'graph',layout:'force',\n    force:{repulsion:46,edgeLength:[10,42],gravity:.16,friction:.22,layoutAnimation:true},\n    roam:true,draggable:true,\n    left:6,right:6,top:6,bottom:6,\n    data:nodes.map(n=>({\n      name:n.name,value:n.value,\n      symbolSize:n.hub?16+Math.sqrt(n.value)*1.6:2.5+Math.sqrt(n.value)*1.5,\n      itemStyle:{color:n.shade,borderWidth:n.hub?2:0,borderColor:INK},\n      label:{show:n.hub,position:'inside',\n        color:INK,fontFamily:'Inter',fontSize:9.5,fontWeight:800},\n    })),\n    links,\n    emphasis:{\n      focus:'adjacency',\n      lineStyle:{color:PAPER,opacity:.9,width:1.4},\n      label:{show:true,color:PAPER,position:'right'},\n    },\n    blur:{itemStyle:{opacity:.1},lineStyle:{opacity:.03}},\n  }],\n};\nconst play=()=>{g.clear();g.setOption(opt)};\nplay();\n// click on empty canvas replays; clicks on nodes are for dragging\ng.getZr().on('click',e=>{if(!e.target)play()});\naddEventListener('resize',()=>g.resize());\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"},"threads":{"label":"Threads · B3","html":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\" />\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\" />\n\u003ctitle>Mono — Thread Triptych, Interactive\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n  :root{--bg:#F0EFEB;--dark:#1C1C1A;--paper:#F0EFEB}\n  *{margin:0;padding:0;box-sizing:border-box}\n  body{background:var(--bg);font-family:'Inter',sans-serif;padding:40px;-webkit-font-smoothing:antialiased;\n    display:flex;justify-content:center}\n  .card{background:var(--dark);color:var(--paper);border-radius:24px;padding:34px 34px 24px;\n    width:min(1200px,100%)}\n  h2{font-weight:700;font-size:19px;letter-spacing:-.02em;margin-bottom:4px}\n  .sub{font-size:12px;color:#8F8E88;margin-bottom:6px}\n  .src{font-size:9.5px;color:#55554F;margin-top:12px;letter-spacing:.08em;font-weight:500}\n  #ch{width:100%;height:74vh;min-height:560px;display:block}\n  #status{height:34px;display:flex;align-items:center;gap:10px;\n    font-size:12px;color:#8F8E88;border-top:1px solid #2E2D29;margin-top:6px;padding-top:8px}\n  #status b{color:var(--paper);font-weight:700}\n  #status .pin{font-size:9px;letter-spacing:.1em;color:#55554F;font-weight:700}\n  svg text{font-family:'Inter',sans-serif;user-select:none}\n\n  /* thread states */\n  .thread{transition:opacity .18s ease,stroke-width .18s ease}\n  .thread.hot{opacity:.95 !important}\n  svg.focused .thread:not(.hot){opacity:.035 !important}\n  .nodelab{cursor:pointer;transition:opacity .18s ease}\n  svg.focused .nodelab:not(.hot){opacity:.25}\n  .hit{cursor:pointer}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"card\">\n  \u003ch2>Where the data actually goes — now answerable\u003c/h2>\n  \u003cdiv class=\"sub\">source → processor → destination · one thread per data path · hover to trace a route · hover any label to pull its whole bundle · click to pin, click dark space to release\u003c/div>\n  \u003csvg id=\"ch\" viewBox=\"0 0 1140 640\" preserveAspectRatio=\"xMidYMid meet\">\u003c/svg>\n  \u003cdiv id=\"status\">\u003cspan id=\"stext\">hover a thread or a label\u003c/span>\u003cspan class=\"pin\" id=\"spin\">\u003c/span>\u003c/div>\n  \u003cdiv class=\"src\">THREAD TRIPTYCH · INTERACTIVE · DATA MAP\u003c/div>\n\u003c/div>\n\u003cscript>\nconst PAPER='#F0EFEB',NS='http://www.w3.org/2000/svg';\nconst el=(p,t,a)=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);p.appendChild(n);return n};\nconst txt=(p,a,s)=>{const n=el(p,'text',a);n.textContent=s;return n};\nconst rnd=(i,k)=>Math.abs(((i*73856093)^(k*19349663))%1000)/1000;\n\n// ── the pipeline ──\nconst SRC=['web-app','ios-app','android','desktop','cli','public-api','webhooks','forms','email-in','chat-widget',\n  'billing-ev','auth-ev','search-log','audit-ev','crash-rep','perf-beacon','cdn-log','edge-log','job-ev','sync-ev',\n  'import','export-req','admin-ui','partner-api','iot-ping','backfill'];\nconst MIDV=['parse','validate','dedupe','enrich','geoip','sessionize','pii-mask','score','sample','route',\n  'batch','window','join','flatten','filter','hash','encrypt','compact','index','tag'];\nconst MID=MIDV.flatMap(v=>[v+'-a',v+'-b']);          // 40 processors\nconst DST=['WAREHOUSE','ANALYTICS','CRM','ADS','BILLING','SEARCH','ML PIPE','ARCHIVE','AUDIT','EXPORTS'];\n\n// routes: each source emits 2-3 full paths; volume is long-tailed\nconst routes=[];\nSRC.forEach((s,i)=>{\n  const n=2+Math.floor(rnd(i+1,5)*2);\n  for(let k=0;k\u003cn;k++){\n    const mi=Math.floor(rnd(i*3+k+2,13)*MID.length);\n    const di=Math.min(9,Math.floor(rnd(i*5+k+4,19)**2*11));   // skew: low dsts hoard\n    const v=Math.round(1+rnd(i*7+k+6,29)**2*30);              // 1..31, long tail\n    routes.push({s:i,m:mi,d:di,v});\n  }\n});\n\n// ── geometry ──\nconst X1=180,X2=560,X3=930;\nconst sy=i=>36+i*22.6, my=i=>30+i*14.6, dy=i=>60+i*57;\nconst path=r=>`M${X1+6} ${sy(r.s)} C${(X1+X2)/2} ${sy(r.s)} ${(X1+X2)/2} ${my(r.m)} ${X2} ${my(r.m)}`\n  +` C${(X2+X3)/2} ${my(r.m)} ${(X2+X3)/2} ${dy(r.d)} ${X3-6} ${dy(r.d)}`;\n\nconst svg=document.getElementById('ch');\nconst stext=document.getElementById('stext'),spin=document.getElementById('spin');\nconst fmt=v=>v+'k ev/day';\nlet pinned=null;\n\n// column headers\n[[X1,'① SOURCE'],[X2,'② PROCESSOR'],[X3,'③ DESTINATION']].forEach(([x,t])=>\n  txt(svg,{x,y:14,'font-size':9,'font-weight':800,fill:PAPER,'letter-spacing':'.14em','text-anchor':'middle'},t));\n\n// threads (drawn first, under labels)\nconst gThreads=el(svg,'g',{});\nroutes.forEach((r,ri)=>{\n  r.el=el(gThreads,'path',{d:path(r),fill:'none',stroke:PAPER,\n    'stroke-width':Math.max(.6,r.v*.14),class:'thread',\n    opacity:.06+Math.min(.2,r.v*.012),'stroke-linecap':'round'});\n  // invisible fat twin: the hover/click target\n  r.hit=el(gThreads,'path',{d:path(r),fill:'none',stroke:'#000','stroke-opacity':0,\n    'stroke-width':9,class:'hit'});\n  r.hit.dataset.route=ri;\n});\n\n// node labels + ticks; each carries hit metadata\nconst mkNode=(x,y,label,anchor,cls,meta,size,fill)=>{\n  const g=el(svg,'g',{class:'nodelab'});\n  g.dataset.kind=meta.kind;g.dataset.idx=meta.idx;\n  el(g,'rect',{x:x-3,y:y-1.6,width:6,height:3.2,fill:PAPER,opacity:.85});\n  txt(g,{x:anchor==='end'?x-9:x+9,y:y+2.6,'font-size':size,'font-weight':600,\n    fill,'text-anchor':anchor},label);\n  // generous invisible hit zone\n  el(g,'rect',{x:anchor==='end'?x-92:x-6,y:y-6.5,width:98,height:13,fill:'#000','fill-opacity':0,class:'hit'});\n  return g;\n};\nSRC.forEach((s,i)=>mkNode(X1,sy(i),s,'end','',{kind:'s',idx:i},7.5,'#B3B0A4'));\nMID.forEach((m,i)=>mkNode(X2,my(i),m,'start','',{kind:'m',idx:i},5.4,'#6A6963'));\nDST.forEach((d,i)=>{\n  const g=el(svg,'g',{class:'nodelab'});\n  g.dataset.kind='d';g.dataset.idx=i;\n  el(g,'circle',{cx:X3,cy:dy(i),r:3.4,fill:PAPER});\n  txt(g,{x:X3+12,y:dy(i)+3,'font-size':8.5,'font-weight':700,fill:'#B3B0A4','letter-spacing':'.08em'},d);\n  el(g,'rect',{x:X3-8,y:dy(i)-10,width:120,height:20,fill:'#000','fill-opacity':0,class:'hit'});\n});\n\n// ── highlight machinery ──\nconst nodeLabs=[...svg.querySelectorAll('.nodelab')];\nconst clear=()=>{\n  svg.classList.remove('focused');\n  routes.forEach(r=>r.el.classList.remove('hot'));\n  nodeLabs.forEach(n=>n.classList.remove('hot'));\n  stext.textContent='hover a thread or a label';spin.textContent='';\n};\nconst focusRoutes=(rs,label)=>{\n  svg.classList.add('focused');\n  routes.forEach(r=>r.el.classList.toggle('hot',rs.includes(r)));\n  nodeLabs.forEach(n=>{\n    const k=n.dataset.kind,ix=+n.dataset.idx;\n    n.classList.toggle('hot',rs.some(r=>(k==='s'&&r.s===ix)||(k==='m'&&r.m===ix)||(k==='d'&&r.d===ix)));\n  });\n  stext.innerHTML=label;\n};\nconst routeLabel=r=>`\u003cb>${SRC[r.s]}\u003c/b> → ${MID[r.m]} → \u003cb>${DST[r.d]}\u003c/b> · ${fmt(r.v)}`;\nconst nodeSel=(kind,idx)=>{\n  const rs=routes.filter(r=>(kind==='s'&&r.s===idx)||(kind==='m'&&r.m===idx)||(kind==='d'&&r.d===idx));\n  const total=rs.reduce((a,r)=>a+r.v,0);\n  const name=kind==='s'?SRC[idx]:kind==='m'?MID[idx]:DST[idx];\n  return [rs,`\u003cb>${name}\u003c/b> · ${rs.length} path${rs.length>1?'s':''} · ${fmt(total)} total`];\n};\n\nconst apply=t=>{\n  const hit=t.closest?.('.hit');\n  if(!hit)return null;\n  const rg=hit.dataset.route,ng=hit.closest('.nodelab');\n  if(rg!=null){const r=routes[+rg];return()=>focusRoutes([r],routeLabel(r))}\n  if(ng){const [rs,lab]=nodeSel(ng.dataset.kind,+ng.dataset.idx);return()=>focusRoutes(rs,lab)}\n  return null;\n};\nsvg.addEventListener('mousemove',e=>{\n  if(pinned)return;\n  const f=apply(e.target);\n  f?f():clear();\n});\nsvg.addEventListener('mouseleave',()=>{if(!pinned)clear()});\nsvg.addEventListener('click',e=>{\n  const f=apply(e.target);\n  if(f){pinned=f;f();spin.textContent='PINNED · CLICK DARK SPACE TO RELEASE'}\n  else{pinned=null;clear()}\n});\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}};
    const picker = document.getElementById("picker");
    const frame = document.getElementById("frame");
    for (const [id, page] of Object.entries(pages)) {
      const option = document.createElement("option");
      option.value = id;
      option.textContent = page.label;
      picker.appendChild(option);
    }
    function show(id) {
      picker.value = id;
      frame.srcdoc = pages[id].html;
      history.replaceState(null, "", "#" + id);
    }
    picker.addEventListener("change", () => show(picker.value));
    show(location.hash.slice(1) in pages ? location.hash.slice(1) : "lupi");
  </script>
