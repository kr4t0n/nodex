packages:
  - packages/*
  - apps/*

# Font assets must resolve inside this checkout's node_modules boundary.
virtualStoreType: project

# The web app syncs registry assets in predev, prebuild and pretypecheck.
enablePrePostScripts: true
# Reinstall hooks even when pnpm finds node_modules already up to date.
optimisticRepeatInstall: false

overrides:
  # Next's image optimizer needs the patched libheif and librsvg binaries.
  # https://github.com/advisories/GHSA-wq5f-xc86-pv6w
  sharp: 0.35.5
  # Bound indexed source-map offsets in PostCSS and Tailwind's source maps.
  # https://github.com/advisories/GHSA-68fv-2mgg-jv7q
  source-map-js: 1.2.2

allowBuilds:
  # Use the published platform binaries; no source-build fallback is needed.
  '@parcel/watcher': false
  esbuild: true
